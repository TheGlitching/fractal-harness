<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fractal dashboard</title>
<style>
  /* ------------------------------------------------------------------
     fractal dashboard - a technical, rust-leaning visual language.
     Near-black ground with a faint grid and vignette; hairline surfaces;
     warm rust/amber primary and a cool cyan reserved for dependencies.
     Every state is written as a word: colour is never the only carrier.
     ------------------------------------------------------------------ */
  :root {
    --bg: #08090c;
    --bg-2: #0b0d12;
    --panel: #0f1218;
    --panel-2: #141821;
    --panel-3: #1a1f2b;
    --line: #242b3a;
    --line-soft: #1a1f2a;
    --text: #ece9e2;
    --muted: #8d94a6;
    --faint: #5b6377;
    --rust: #d98a4e;
    --rust-2: #f0a860;
    --rust-soft: rgba(217,138,78,.14);
    --cyan: #58c9d6;
    --cyan-soft: rgba(88,201,214,.14);
    --complete: #6fbf8f;
    --running: #e0a340;
    --ready: #58c9d6;
    --failed: #e0716f;
    --waiting: #9b8fd0;
    --pending: #717a8d;
    --suspended: #b48ead;
    --split: #d98a4e;
    --accent: var(--rust);
    --accent-ink: #17100a;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 18px 44px -26px rgba(0,0,0,.9);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 640px at 50% -12%, rgba(217,138,78,.10), transparent 62%),
      radial-gradient(900px 620px at 108% 112%, rgba(88,201,214,.06), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg-2));
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  /* A faint technical grid that drifts almost imperceptibly. */
  body::before {
    content: ""; position: fixed; inset: -3px; z-index: -1; pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 26px);
    -webkit-mask-image: radial-gradient(ellipse 82% 72% at 50% 26%, #000 32%, transparent 100%);
    mask-image: radial-gradient(ellipse 82% 72% at 50% 26%, #000 32%, transparent 100%);
    animation: drift 64s linear infinite;
  }
  /* Depth: a vignette that sinks the corners into black. */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(125% 95% at 50% -18%, transparent 42%, rgba(0,0,0,.6) 100%);
  }
  @keyframes drift { to { background-position: 0 260px, 260px 0; } }
  a { color: var(--rust); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, .mono { font-family: var(--mono); }

  /* ---------- app bar ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px;
    background: rgba(8,9,12,.82);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; letter-spacing: .02em; font-size: 15px;
  }
  .brand .spark {
    color: var(--rust); font-size: 13px;
    filter: drop-shadow(0 0 6px rgba(217,138,78,.7));
  }
  .project {
    color: var(--muted); font-family: var(--mono); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 46vw; min-width: 0;
  }
  .appbar .spacer { flex: 1; }
  .live {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted); white-space: nowrap;
    font-family: var(--mono);
  }
  .live .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--complete); box-shadow: 0 0 0 0 rgba(111,191,143,.5);
  }
  .live.busy .pulse { background: var(--running); animation: pulse 1.4s infinite; }
  .live.off .pulse { background: var(--failed); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(224,163,64,.55); }
    70% { box-shadow: 0 0 0 7px rgba(224,163,64,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,163,64,0); }
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 18px; }

  /* ---------- overview ---------- */
  .overview {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .overview::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--rust), transparent 80%);
    opacity: .8;
  }
  .overview-top { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .overview-goal { flex: 1 1 340px; min-width: 0; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: .14em; font-size: 10.5px;
    color: var(--faint); font-weight: 700; margin-bottom: 6px;
  }
  .goal-title {
    font-size: clamp(18px, 2.4vw, 25px); line-height: 1.25; font-weight: 650;
    margin: 0; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .goal-sub { margin-top: 8px; color: var(--muted); font-size: 12.5px; font-family: var(--mono); }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat {
    min-width: 76px; flex: 1 1 auto;
    background: var(--panel-2); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 8px 12px;
  }
  .stat .n { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stat.is-complete .n { color: var(--complete); }
  .stat.is-running .n { color: var(--running); }
  .stat.is-failed .n { color: var(--failed); }
  .stat.is-pending .n { color: var(--pending); }
  .stat.is-refused .n { color: var(--failed); }
  .stat.is-split .n { color: var(--split); }

  .progress { margin-top: 16px; }
  .progress-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; gap: 10px; flex-wrap: wrap; }
  .bar { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line-soft); }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--rust), var(--rust-2)); width: 0; transition: width .5s ease; box-shadow: 0 0 12px rgba(217,138,78,.5); }

  .nowrunning {
    margin-top: 16px; padding: 12px 14px;
    background: var(--rust-soft);
    border: 1px solid rgba(217,138,78,.3);
    border-radius: 10px;
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  .nowrunning.idle { background: var(--panel-2); border-color: var(--line-soft); }
  .nowrunning .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--rust-2); font-weight: 700; }
  .nowrunning.idle .label { color: var(--faint); }
  .nowrunning .who { font-weight: 600; overflow-wrap: anywhere; }
  .nowrunning .act {
    font-family: var(--mono); font-size: 12.5px; color: var(--muted);
    overflow-wrap: anywhere; min-width: 0; flex: 1 1 260px;
  }

  /* ---------- panels / layout ---------- */
  .graph-panel { margin-bottom: 18px; }
  .graph-panel > * { min-width: 0; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--line-soft);
    flex-wrap: wrap;
  }
  .panel-head h2 {
    margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .13em;
    color: var(--muted); font-weight: 700;
  }
  .muted { color: var(--muted); }
  .gtools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .gtools label.gtoggle {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap;
  }
  .gtools label.gtoggle:hover { color: var(--text); }
  .gtools input[type=checkbox] { accent-color: var(--rust); width: 14px; height: 14px; }

  .viewtoggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .viewtoggle button, .zoomctl button {
    background: transparent; color: var(--muted); border: 0; padding: 4px 11px;
    font: inherit; font-size: 12px; cursor: pointer; line-height: 1.4;
  }
  .viewtoggle button.active { background: var(--rust); color: var(--accent-ink); font-weight: 700; }
  .zoomctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .zoomctl button { padding: 4px 9px; font-family: var(--mono); }
  .zoomctl button:hover { color: var(--rust); }
  .zoomctl .sep { width: 1px; background: var(--line); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 16px;
    padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
    font-size: 11.5px; color: var(--muted);
  }
  .legend .item { display: inline-flex; align-items: center; gap: 7px; }
  .legend .item.hint { color: var(--faint); }
  .legend .swatch { width: 22px; height: 0; border-top: 2px solid var(--line); }
  .legend .swatch.parent { border-color: var(--line); }
  .legend .swatch.dep { border-color: var(--cyan); border-top-style: dashed; }
  .legend .swatch.active { border-color: var(--rust); }
  .legend .swatch.complete { border-color: var(--complete); }
  .legend .swatch.failed { border-color: var(--failed); }
  .legend .swatch.pending { border-color: var(--pending); border-top-style: dashed; opacity: .6; }

  .nextup {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    padding: 9px 14px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px;
  }
  .nextup .label {
    text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px;
    font-weight: 700; color: var(--rust-2); white-space: nowrap;
  }
  .nextup.idle .label { color: var(--faint); }
  .nextup .who { color: var(--text); overflow-wrap: anywhere; }
  .nextup .who .sep { color: var(--faint); }
  .nextup .note { color: var(--muted); }
  .nextup .count { color: var(--faint); font-variant-numeric: tabular-nums; }

  /* ---------- graph ---------- */
  .graph-scroll { overflow: auto; max-height: calc(100vh - 250px); overscroll-behavior: contain; }
  .graph-scroll.graph-view { overflow: hidden; height: clamp(380px, 64vh, 780px); max-height: none; }
  .graph {
    position: relative; width: 100%; min-height: 220px;
    background:
      radial-gradient(circle at 50% 50%, rgba(217,138,78,.05), transparent 62%),
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(255,255,255,.02) 27px 28px),
      repeating-linear-gradient(90deg, transparent 0 27px, rgba(255,255,255,.02) 27px 28px);
  }
  .graph-scroll.graph-view .graph { height: 100%; }
  .graph svg.graph-svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .graph svg.graph-svg.panning { cursor: grabbing; }

  .lattice-ring { fill: none; stroke: rgba(255,255,255,.05); stroke-width: 1; }
  .lattice-frame { fill: none; stroke: rgba(217,138,78,.10); stroke-width: 1; }
  .lattice-core { fill: url(#coreGlow); }

  .edge { fill: none; stroke-linecap: round; }
  .edge-parent { stroke: var(--line); stroke-width: 1.15; }
  .edge-parent.edge-pending { stroke: var(--pending); opacity: .5; stroke-dasharray: 4 5; }
  .edge-parent.edge-complete { stroke: rgba(111,191,143,.55); }
  .edge-parent.edge-active { stroke: var(--running); stroke-width: 1.7; stroke-dasharray: 6 7; animation: dashflow 1.1s linear infinite; }
  .edge-parent.edge-failed { stroke: var(--failed); stroke-width: 1.7; }
  .edge-parent.onpath {
    stroke: var(--rust); stroke-width: 2.3; stroke-dasharray: none;
    filter: drop-shadow(0 0 4px rgba(217,138,78,.55));
  }
  .edge-dep { stroke: var(--cyan); stroke-width: 1.15; stroke-dasharray: 3 5; opacity: 0; transition: opacity .18s ease; }
  .edge-dep.show { opacity: .85; animation: dashflow 1.8s linear infinite; }
  .edge-dep.edge-active { stroke: var(--running); stroke-dasharray: 5 5; animation: dashflow 1s linear infinite; }
  .edge-dep.edge-active.show { opacity: 1; }
  .edge-dep.edge-failed { stroke: var(--failed); }
  .edge-dep.edge-complete { stroke: var(--complete); }
  .arrow-dep { fill: var(--cyan); }
  @keyframes dashflow { to { stroke-dashoffset: -26; } }

  .gnode { cursor: pointer; }
  .gnode .node-halo { fill: var(--rust); opacity: 0; transition: opacity .2s ease; }
  .gnode .node-dot {
    fill: var(--panel-3); stroke: var(--line); stroke-width: 1.3;
    transition: stroke .18s ease, stroke-width .18s ease;
  }
  .gnode:hover .node-dot { stroke: var(--rust); }
  .gnode:focus-visible { outline: none; }
  .gnode:focus-visible .node-halo { opacity: .22; }
  .gnode .node-glyph { fill: var(--muted); font-family: var(--mono); pointer-events: none; }
  .gnode.onpath .node-halo { opacity: .14; }
  .gnode.selected .node-dot { stroke: var(--rust); stroke-width: 2.6; }
  .gnode.selected .node-halo { opacity: .3; }
  .gnode.selected .node-label .nl-id { fill: var(--rust-2); }

  /* Status is carried by stroke plus the status word on every label. */
  .gnode.complete .node-dot { stroke: var(--complete); }
  .gnode.complete .node-glyph { fill: var(--complete); }
  .gnode.running .node-dot { stroke: var(--running); stroke-width: 2; }
  .gnode.running .node-glyph { fill: var(--running); }
  .gnode.running { animation: nodepulse 1.9s ease-in-out infinite; }
  .gnode.ready .node-dot { stroke: var(--ready); }
  .gnode.ready .node-glyph { fill: var(--ready); }
  .gnode.waiting .node-dot { stroke: var(--waiting); }
  .gnode.waiting .node-glyph { fill: var(--waiting); }
  .gnode.failed .node-dot { stroke: var(--failed); stroke-width: 2; }
  .gnode.failed .node-glyph { fill: var(--failed); }
  .gnode.suspended .node-dot { stroke: var(--suspended); }
  .gnode.split .node-dot { stroke: var(--split); }
  @keyframes nodepulse {
    0%, 100% { filter: drop-shadow(0 0 1px rgba(224,163,64,.35)); }
    50% { filter: drop-shadow(0 0 7px rgba(224,163,64,.8)); }
  }
  .node-label { font-family: var(--mono); pointer-events: none; }
  .node-label .nl-id { fill: var(--text); letter-spacing: -.02em; }
  .node-label .nl-goal { fill: var(--muted); }
  .node-label .nl-st { font-size: .82em; letter-spacing: .02em; }
  .node-label .st-complete { fill: var(--complete); }
  .node-label .st-running { fill: var(--running); }
  .node-label .st-ready { fill: var(--ready); }
  .node-label .st-waiting { fill: var(--waiting); }
  .node-label .st-failed { fill: var(--failed); }
  .node-label .st-suspended { fill: var(--suspended); }
  .node-label .st-split { fill: var(--split); }
  .node-label .st-pending { fill: var(--pending); }

  /* ---------- node tooltip ---------- */
  .gtt {
    position: fixed; z-index: 60; max-width: min(86vw, 330px);
    pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity .12s ease, transform .12s ease;
    background: rgba(10,12,16,.97);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 16px 46px -16px rgba(0,0,0,.9), 0 0 0 1px rgba(217,138,78,.14);
    font-size: 12.5px; color: var(--text);
  }
  .gtt.show { opacity: 1; transform: none; }
  .gtt-id { font-size: 11px; color: var(--rust-2); overflow-wrap: anywhere; }
  .gtt-goal { margin-top: 3px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .gtt-row { margin-top: 7px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gtt-metric { color: var(--faint); font-family: var(--mono); font-size: 11px; }
  .gtt-metrics {
    margin-top: 7px; display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 11px; color: var(--muted); border-top: 1px solid var(--line-soft); padding-top: 7px;
  }
  .gtt-metrics b { color: var(--text); font-family: var(--mono); }
  .gtt-act {
    margin-top: 7px; font-family: var(--mono); font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--line-soft); padding-top: 7px; overflow-wrap: anywhere;
  }

  /* ---------- rows view ---------- */
  #tree ul { list-style: none; margin: 0; padding: 0; }
  #tree li { position: relative; }
  #tree li > ul { margin-left: 14px; padding-left: 12px; border-left: 1px solid var(--line-soft); }
  .row {
    width: 100%; text-align: left; cursor: pointer;
    display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center;
    gap: 8px 10px;
    padding: 8px 10px; margin: 2px 0;
    background: transparent; border: 1px solid transparent; border-radius: 10px;
    color: var(--text); font: inherit;
  }
  .row:hover { background: var(--panel-2); }
  .row:focus-visible { outline: 2px solid var(--rust); outline-offset: 1px; }
  .row.selected { background: var(--rust-soft); border-color: rgba(217,138,78,.45); }
  .row .doto { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .row.running .doto { animation: pulse 1.4s infinite; }
  .row-main { min-width: 0; }
  .row-title {
    font-size: 14px; font-weight: 550; line-height: 1.3;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow-wrap: anywhere;
  }
  .row-activity {
    margin-top: 3px; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-activity:empty { display: none; }
  .row-tag {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    background: var(--bg-2); border: 1px solid var(--line-soft);
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }

  /* ---------- status chips ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap;
    border: 1px solid currentColor; color: var(--pending);
  }
  .chip .doto { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: none; }
  .chip.complete { color: var(--complete); }
  .chip.running { color: var(--running); }
  .chip.running .doto { animation: pulse 1.4s infinite; }
  .chip.split { color: var(--split); }
  .chip.failed { color: var(--failed); }
  .chip.suspended { color: var(--suspended); }
  .chip.pending { color: var(--pending); }
  .chip.ready { color: var(--ready); }
  .chip.waiting { color: var(--waiting); }

  .badge {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 7px; margin-left: 6px;
  }
  .badge.warn { color: var(--running); border-color: rgba(224,163,64,.4); }
  .badge.bad { color: var(--failed); border-color: rgba(224,113,111,.4); }

  /* ---------- detail ---------- */
  .detail { min-width: 0; }
  .detail-head { padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
  .detail-head h1 { margin: 10px 0 6px; font-size: clamp(17px, 2vw, 22px); line-height: 1.3; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .meta .mono { font-size: 12px; overflow-wrap: anywhere; }
  .detail-body { padding: 4px 18px 22px; }
  .section { padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
  .section:last-child { border-bottom: 0; }
  .section h3 {
    margin: 0 0 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--rust); font-weight: 700;
  }
  .section h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .section h4:first-child { margin-top: 0; }
  ul.clean { margin: 0 0 8px; padding-left: 18px; }
  ul.clean li { margin: 3px 0; overflow-wrap: anywhere; }
  .empty { color: var(--faint); font-style: italic; font-size: 13px; }
  pre.box {
    margin: 6px 0 0; padding: 12px; background: var(--bg-2);
    border: 1px solid var(--line-soft); border-radius: 10px;
    overflow: auto; max-height: 380px; font-size: 12.5px; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .cmd { font-family: var(--mono); font-size: 12.5px; background: var(--bg-2); border: 1px solid var(--line-soft); border-radius: 6px; padding: 1px 6px; }

  pre.diff-box {
    margin: 6px 0 0; padding: 6px 0; background: var(--bg-2);
    border: 1px solid var(--line-soft); border-radius: 10px;
    overflow: auto; max-height: 460px; font-size: 12.5px; line-height: 1.45;
    white-space: pre;
  }
  .diffline { display: block; width: max-content; min-width: 100%; padding: 0 12px; }
  .diffline.add { background: rgba(111,191,143,.13); color: #a9ecc3; }
  .diffline.del { background: rgba(224,113,111,.13); color: #ffb7b7; }
  .diffline.hunk { background: var(--rust-soft); color: var(--rust-2); }

  .events { display: flex; flex-direction: column; gap: 2px; }

  .event .name {
    font-family: var(--mono); font-size: 11px; color: var(--rust);
    text-transform: none; white-space: nowrap;

  .event.err .name { color: var(--failed); }
  .event .msg { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }

  details.disclosure { margin: 8px 0 0; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg-2); }
  details.disclosure > summary {
    cursor: pointer; padding: 9px 12px; font-size: 12.5px; color: var(--muted);
    list-style: none; user-select: none;
  }
  details.disclosure > summary::-webkit-details-marker { display: none; }
  details.disclosure > summary::before { content: "▸ "; color: var(--rust); }
  details.disclosure[open] > summary::before { content: "▾ "; }
  details.disclosure .inner { padding: 0 12px 12px; }

  /* ---------- steering ---------- */
  .steer-group { margin-top: 18px; }
  .steer-group:first-of-type { margin-top: 0; }
  .steer-group > h4.group-title {
    margin: 0 0 3px; font-size: 12.5px; font-weight: 700; color: var(--text);

  .steer-group > p.group-hint { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .steer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .action {
    background: var(--bg-2); border: 1px solid var(--line-soft);

  }
  .action h4 { margin: 0 0 2px; font-size: 13.5px; color: var(--text); font-weight: 650; text-transform: none; letter-spacing: 0; }
  .action p.hint { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .action p.hint .when { color: var(--text); font-weight: 600; }
  .action p.hint .consequence { color: var(--running); }
  .action.destructive { border-color: rgba(224,113,111,.4); background: rgba(224,113,111,.05); }
  .action.destructive h4 { color: var(--failed); }

  .confirm-row {
    display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    padding: 10px; border-radius: 9px;

  .confirm-row .confirm-msg { font-size: 12.5px; color: var(--text); overflow-wrap: anywhere; }
  .confirm-row .confirm-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .result {
    margin: 0 0 14px; padding: 11px 13px; border-radius: 10px; font-size: 13px;
    border: 1px solid var(--line-soft); background: var(--bg-2); overflow-wrap: anywhere;
  }
  .result.ok { border-color: rgba(111,191,143,.5); }
  .result.err { border-color: rgba(224,113,111,.5); color: #ffb4b4; }
  .result .head { font-weight: 650; display: block; margin-bottom: 2px; }
  .result.ok .head { color: var(--complete); }
  .result.err .head { color: var(--failed); }
  .result .stale-note { color: var(--running); display: block; margin-top: 5px; }

  li.hit, .event.hit {
    background: rgba(111,191,143,.14); border-radius: 6px;
    box-shadow: inset 2px 0 0 var(--complete); padding-left: 8px;
  }
  form { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 12px; color: var(--muted); }
  input[type=text], textarea, select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;

  input:focus, textarea:focus, select:focus { outline: 2px solid var(--rust); outline-offset: 0; border-color: transparent; }
  textarea { min-height: 68px; resize: vertical; }
  .btn {

    padding: 8px 14px; font: inherit; font-weight: 650; font-size: 13px;

    transition: filter .12s ease, transform .06s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.warn { background: var(--running); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }

  /* ---------- toast / states ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 70; max-width: min(92vw, 620px);
    padding: 11px 16px; border-radius: 10px;

  .state-note {
    margin: 8px; padding: 14px; border-radius: 10px; text-align: center;
    color: var(--muted); font-size: 13.5px; border: 1px dashed var(--line);
  }
  .state-note.err { color: #ffb4b4; border-color: rgba(224,113,111,.4); }
  .skeleton { border-radius: 8px; background: linear-gradient(90deg, var(--panel-2), var(--line-soft), var(--panel-2)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ---------- responsive ---------- */
  @media (max-width: 900px) {
    .wrap { padding: 12px; }
    .project { max-width: 100%; }
    .overview { padding: 15px; }
    .stats { width: 100%; }
    .stat { min-width: calc(50% - 4px); }
    .graph-scroll.graph-view { height: clamp(300px, 48vh, 560px); }
  }
  @media (max-width: 430px) {
    body { font-size: 14px; }
    .stat { min-width: calc(50% - 4px); padding: 7px 9px; }
    .stat .n { font-size: 19px; }
    .appbar { padding: 9px 12px; gap: 8px; }
    .detail-head, .detail-body { padding-left: 13px; padding-right: 13px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }

</style>
