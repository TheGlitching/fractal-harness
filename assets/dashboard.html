<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fractal — the run</title>
<link rel="icon" href="data:," />
<style>
  /* ------------------------------------------------------------------
     fractal dashboard — a from-scratch surface over `fractal serve`.

     Three concerns, ranked:
       1. The graph: the hero. Circles only, colour carries state, every
          link is always drawn, hover scales a node into focus, drag pans,
          click selects.
       2. The butler: the only steering surface. One input, nothing else.
       3. The node detail: read-only.

     Visual language is the pinned La Fabrique à Sites green theme:
     near-black green ground, a fixed visible 12-column grid, bright green
     accent, serif display headings, uppercase monospace labels, 2px rules.
     Offline: system stacks only.
     ------------------------------------------------------------------ */
  :root {
    --bg:         oklch(14% 0.012 145);
    --bg-2:       oklch(16.5% 0.013 145);
    --panel:      oklch(18% 0.014 145);
    --fg:         oklch(95% 0.03 130);
    --muted:      oklch(70% 0.04 130);
    --faint:      oklch(58% 0.04 132);
    --accent:     oklch(86% 0.24 132);
    --accent-ink: oklch(15% 0.03 132);
    --border:     oklch(95% 0.03 130);
    --line-soft:  color-mix(in oklab, var(--fg) 20%, transparent);
    --grid:       color-mix(in oklab, var(--fg) 11%, transparent);
    /* Each state owns one hue. The graph is circles, so colour is the story. */
    --done:       oklch(82% 0.21 142);
    --run:        oklch(86% 0.17 92);
    --ready:      oklch(78% 0.14 235);
    --failed:     oklch(70% 0.21 28);
    --blocked:    oklch(78% 0.13 305);
    --pending:    oklch(58% 0.035 145);
    --split:      oklch(80% 0.11 180);
    --bw: 2px;
    --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --serif: "Times New Roman", "Iowan Old Style", Georgia, serif;
    --ease: cubic-bezier(.2, .7, .15, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --s2: 16px; --s3: 24px;
    --gap: clamp(14px, 3vw, 40px);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  html {
    caret-color: var(--accent);
    scrollbar-color: var(--line-soft) var(--bg);
    scrollbar-width: thin;
    -webkit-text-size-adjust: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: calc(100% / 12) 100%;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 400; letter-spacing: -.015em; margin: 0; line-height: 1.04; }
  p { margin: 0; }
  a { color: var(--accent); text-decoration: none; text-underline-offset: 3px; }
  a:hover { text-decoration: underline; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line-soft); border: 2px solid var(--bg); }
  ::placeholder { color: var(--faint); opacity: 1; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  time { font-variant-numeric: tabular-nums; }

  /* ---------- top bar: brand and life, nothing else ---------- */
  .bar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: var(--s2);
    padding: 12px var(--gap);
    background: var(--bg);
    border-bottom: var(--bw) solid var(--border);
  }
  .brand { display: inline-flex; align-items: baseline; gap: 8px; font-family: var(--serif); font-size: 21px; letter-spacing: -.02em; white-space: nowrap; }
  .brand .spark { color: var(--accent); font-size: 13px; }
  .bar .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .live .dot { width: 8px; height: 8px; background: var(--done); flex: none; }
  .live.busy .dot { background: var(--run); animation: pulse 1.4s ease-in-out infinite; }
  .live.off .dot { background: var(--failed); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- layout ---------- */
  .wrap { position: relative; z-index: 1; width: min(100% - 2 * var(--gap), 1280px); margin-inline: auto; }
  section { padding: clamp(28px, 4vw, 52px) 0; border-bottom: var(--bw) solid var(--border); }
  section:last-of-type { border-bottom: 0; }
  .sec-head { min-width: 0; margin-bottom: var(--s3); }
  .sec-head h2 { font-size: clamp(20px, 2.4vw, 26px); }

  /* ---------- hero: the run and its graph ---------- */
  .hero h1 { font-size: clamp(23px, 3.1vw, 40px); max-width: 34ch; overflow-wrap: anywhere; }
  .hero .now { margin-top: 14px; color: var(--muted); font-size: 14px; display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
  .hero .now .what { color: var(--fg); }
  .hero .now .pulse-dot { width: 8px; height: 8px; flex: none; background: var(--run); animation: pulse 1.4s ease-in-out infinite; align-self: center; }
  .progress { height: 3px; background: color-mix(in oklab, var(--fg) 12%, transparent); margin-top: var(--s3); }
  .progress > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s var(--ease-out); }

  .graph-frame {
    position: relative; margin-top: var(--s3);
    height: clamp(400px, 58vh, 620px);
    border: var(--bw) solid var(--border);
    background: var(--bg-2);
    overflow: hidden; touch-action: none;
  }
  .graph, .graph svg.graph-svg { display: block; width: 100%; height: 100%; }
  .graph svg.graph-svg { cursor: grab; }
  .graph svg.graph-svg.panning { cursor: grabbing; }
  .graph-empty { display: grid; place-items: center; height: 100%; color: var(--faint); font-size: 13.5px; }

  /* ---------- edges: every link, always drawn ---------- */
  .edge { fill: none; stroke: color-mix(in oklab, var(--fg) 30%, transparent); stroke-width: 1.3; transition: stroke .35s var(--ease-out), stroke-width .35s var(--ease-out); }
  .edge-parent.onpath { stroke: var(--accent); stroke-width: 2.2; }
  .edge-parent.edge-running { stroke: var(--run); stroke-dasharray: 3 5; animation: dash 1.2s linear infinite; }
  .edge-parent.edge-complete { stroke: color-mix(in oklab, var(--done) 55%, transparent); }
  .edge-parent.edge-failed { stroke: var(--failed); }
  .edge-dep { stroke: color-mix(in oklab, var(--fg) 24%, transparent); stroke-width: 1; stroke-dasharray: 2 5; }
  .edge-dep.onpath { stroke: color-mix(in oklab, var(--accent) 70%, transparent); }
  @keyframes dash { to { stroke-dashoffset: -8; } }

  /* ---------- nodes: plain circles, colour is the state ---------- */
  .gnode { cursor: pointer; outline: none; transition: opacity .28s var(--ease-out); }
  .gnode .shape {
    fill: var(--pending); stroke: none;
    transform-box: fill-box; transform-origin: center;
    transition: transform .24s var(--ease-out), fill .35s var(--ease-out), opacity .24s var(--ease-out);
  }
  .gnode .halo { fill: none; stroke: transparent; transition: stroke .2s var(--ease-out), stroke-width .2s var(--ease-out); }
  .gnode .hit { fill: transparent; }
  .gnode.complete .shape { fill: var(--done); }
  .gnode.running .shape { fill: var(--run); }
  .gnode.ready .shape { fill: var(--ready); }
  .gnode.failed .shape { fill: var(--failed); }
  .gnode.suspended .shape { fill: var(--blocked); }
  .gnode.split .shape { fill: var(--split); }
  .gnode.waiting .shape, .gnode.pending .shape { fill: var(--pending); }
  .gnode.hover .shape { transform: scale(1.6); }
  .gnode.selected .shape { transform: scale(1.35); }
  .gnode.selected .halo, .gnode.hover .halo, .gnode:focus-visible .halo { stroke: var(--accent); stroke-width: 2; }
  .gnode:focus-visible .halo { stroke-width: 3; }
  .gnode .ring { fill: none; stroke: var(--run); stroke-width: 1.4; stroke-dasharray: 3 5; transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gnode.enter { animation: nodeIn .4s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 28ms); }
  .gnode.enter .shape { animation: shapeIn .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 28ms); }
  @keyframes nodeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shapeIn { from { transform: scale(.25); } to { transform: scale(1); } }
  .gnode.change .shape { animation: statePop .7s var(--ease-out); }
  @keyframes statePop { 0% { transform: scale(1); } 38% { transform: scale(1.5); } 100% { transform: scale(1); } }

  .svg-focus .gnode.dim { opacity: .25; }

  .graph-foot { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; margin-top: 14px; }
  .key { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); font-style: normal; flex: none; }
  .hint { color: var(--faint); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .hint b { color: var(--muted); font-weight: 400; }

  /* ---------- butler chat: title, conversation, one input ---------- */
  .butler .chat-log {
    display: flex; flex-direction: column; gap: var(--s2);
    min-height: 90px; max-height: clamp(240px, 40vh, 460px);
    overflow-y: auto; overscroll-behavior: contain;
    padding-right: 6px;
  }
  .chat-empty { color: var(--faint); font-size: 13.5px; }
  .turn { display: flex; flex-direction: column; gap: 10px; }
  .msg { border: var(--bw) solid var(--line-soft); padding: 12px 14px; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; max-width: min(88%, 640px); background: color-mix(in oklab, var(--accent) 13%, transparent); border-color: var(--accent); white-space: pre-wrap; }
  .msg.butler { background: var(--bg-2); }
  .msg.butler.err { border-color: var(--failed); }
  .msg.butler.err b { color: var(--failed); }
  .msg.butler.working { color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .wdots { display: inline-flex; gap: 4px; flex: none; }
  .wdots i { width: 6px; height: 6px; background: var(--run); animation: wdot 1.2s ease-in-out infinite; }
  .wdots i:nth-child(2) { animation-delay: .16s; }
  .wdots i:nth-child(3) { animation-delay: .32s; }
  @keyframes wdot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .plan-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .plan-action { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 9px; border: 1px solid currentColor; color: var(--accent); }
  .plan-action.none { color: var(--done); }
  .plan-action.reopen, .plan-action.retry { color: var(--run); }
  .plan-action.split { color: var(--ready); }
  .plan-nodes { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .plan-why { color: var(--fg); font-size: 14px; }
  .changes { margin-top: 10px; border-top: 1px solid var(--line-soft); padding-top: 9px; display: flex; flex-direction: column; gap: 4px; }
  .changes .changes-title { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .change { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  details.reply { margin-top: 10px; }
  details.reply > summary { cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); list-style: none; }
  details.reply > summary::-webkit-details-marker { display: none; }
  details.reply > summary::before { content: "+ "; color: var(--accent); }
  details.reply[open] > summary::before { content: "− "; }
  details.reply pre { margin: 8px 0 0; padding: 12px; background: var(--bg); border: 1px solid var(--line-soft); overflow: auto; max-height: 320px; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .chat-form { margin-top: var(--s2); display: flex; gap: 10px; align-items: flex-end; }
  .chat-form textarea {
    flex: 1 1 auto; min-width: 0; min-height: 50px; max-height: 180px; resize: vertical;
    background: var(--bg); color: var(--fg); border: var(--bw) solid var(--line-soft);
    padding: 12px 14px; font: inherit; font-size: 15px; line-height: 1.45;
  }
  .chat-form textarea:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chat-context { margin-top: 10px; font-size: 12px; color: var(--faint); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .chat-context .ctx { color: var(--muted); }
  .chat-context button { font: inherit; font-size: 12px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }

  /* ---------- buttons ---------- */
  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    padding: .75em 1.2em; min-height: 44px; cursor: pointer; overflow: hidden; isolation: isolate;
    border: var(--bw) solid var(--border); background: transparent; color: var(--fg);
    font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    transition: color .2s var(--ease), transform .2s var(--ease);
  }
  .btn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--accent); transform: scaleY(0); transform-origin: bottom; transition: transform .28s var(--ease); }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:disabled::after { transform: scaleY(0); }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover:not(:disabled) { color: var(--accent-ink); }
    .btn:hover:not(:disabled)::after { transform: scaleY(1); }
  }
  .btn:focus-visible { color: var(--accent-ink); }
  .btn:focus-visible::after { transform: scaleY(1); }

  /* ---------- node detail (read-only) ---------- */
  .detail-empty { color: var(--faint); font-style: italic; font-size: 13.5px; }
  .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
  .detail-head h2 { font-size: clamp(20px, 2.6vw, 30px); max-width: 44ch; overflow-wrap: anywhere; }
  .detail-head .meta { margin-top: 8px; color: var(--faint); font-size: 12px; overflow-wrap: anywhere; }
  .detail-head .meta b { color: var(--muted); font-weight: 400; }
  .detail-grid { margin-top: var(--s3); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
  .detail-block h4 { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 400; }
  .detail-block .prose { color: var(--fg); font-size: 14px; line-height: 1.6; max-width: 72ch; overflow-wrap: anywhere; white-space: pre-wrap; }
  .detail-act { color: var(--muted); font-size: 13.5px; border: var(--bw) solid var(--line-soft); background: var(--bg-2); padding: 11px 13px; overflow-wrap: anywhere; }
  .detail-act.live { border-color: var(--run); }
  ul.clean { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.clean li { font-size: 13.5px; max-width: 72ch; overflow-wrap: anywhere; }
  ul.clean li::before { content: "— "; color: var(--faint); }
  .events { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; }
  .event { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 12px; font-size: 12.5px; }
  .event time { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .event .name { font-family: var(--mono); font-size: 11px; color: var(--accent); white-space: nowrap; }
  .event .msg { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
  .event.err .name, .event.err .msg { color: var(--failed); }
  details.code { margin-top: var(--s2); }
  details.code > summary { cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); list-style: none; }
  details.code > summary::-webkit-details-marker { display: none; }
  details.code > summary::before { content: "+ "; color: var(--accent); }
  details.code[open] > summary::before { content: "− "; }
  pre.diff-box { margin: 10px 0 0; padding: 6px 0; background: var(--bg); border: 1px solid var(--line-soft); overflow: auto; max-height: 440px; font-size: 12.5px; line-height: 1.5; white-space: pre; }
  .diffline { display: block; width: max-content; min-width: 100%; padding: 0 12px; color: var(--muted); }
  .diffline.add { background: color-mix(in oklab, var(--done) 13%, transparent); color: var(--done); }
  .diffline.del { background: color-mix(in oklab, var(--failed) 13%, transparent); color: var(--failed); }
  .diffline.hunk { background: color-mix(in oklab, var(--accent) 13%, transparent); color: var(--accent); }
  .diffline.file { color: var(--fg); font-weight: 600; }
  .diffline.meta { color: var(--faint); }
  .diffline.head { color: var(--accent); }

  /* ---------- status chip ---------- */
  .chip { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; border: 1px solid currentColor; padding: 3px 9px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--pending); }
  .chip .dot { width: 7px; height: 7px; background: currentColor; }
  .chip.complete { color: var(--done); }
  .chip.running { color: var(--run); }
  .chip.running .dot { animation: pulse 1.4s infinite; }
  .chip.ready { color: var(--ready); }
  .chip.failed { color: var(--failed); }
  .chip.suspended { color: var(--blocked); }
  .chip.split { color: var(--split); }
  .chip.waiting, .chip.pending { color: var(--pending); }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 14px); z-index: 70;
    max-width: min(92vw, 620px); padding: 12px 16px; background: var(--panel);
    border: var(--bw) solid var(--border); font-size: 13.5px; opacity: 0; pointer-events: none;
    transition: opacity .2s var(--ease-out), transform .2s var(--ease-out);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: var(--failed); color: var(--failed); }
  .empty { color: var(--faint); font-style: italic; font-size: 13.5px; }

  @media (min-width: 1040px) {
    /* Laptop and up: the graph owns the main column, the butler rides a
       sticky rail so every change is one keystroke away at any scroll. */
    .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); column-gap: var(--s3); }
    section { border-bottom: 0; }
    .hero { grid-column: 1; grid-row: 1; border-bottom: var(--bw) solid var(--border); }
    .detail { grid-column: 1; grid-row: 2; }
    .rail { grid-column: 2; grid-row: 1 / span 2; border-left: var(--bw) solid var(--border); padding-left: var(--s3); }
    .butler {
      position: sticky; top: 76px; align-self: start;
      max-height: calc(100vh - 100px);
      display: flex; flex-direction: column;
    }
    .butler .chat-log { flex: 1 1 auto; max-height: none; }
    .butler .sec-head { margin-bottom: var(--s2); }
  }
  @media (max-width: 720px) {
    .graph-frame { height: 52vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .gnode.hover .shape, .gnode.selected .shape { transform: none !important; }
  }
</style>
</head>
<body>
  <header class="bar">
    <span class="brand"><span class="spark">◆</span>fractal</span>
    <span class="spacer"></span>
    <span class="live off" id="live"><span class="dot"></span><span id="liveText">connecting…</span></span>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Loading run…</h1>
      <p class="now" id="hero-now" aria-live="polite"></p>
      <div class="progress" role="progressbar" aria-label="Run progress"><span id="progress-fill"></span></div>
      <div class="graph-frame" id="graph-frame">
        <div class="graph" id="tree"><div class="graph-empty">Waiting for the run…</div></div>
      </div>
      <div class="graph-foot">
        <div class="key" aria-hidden="true">
          <span><i style="--c:var(--done)"></i>done</span>
          <span><i style="--c:var(--run)"></i>running</span>
          <span><i style="--c:var(--ready)"></i>ready</span>
          <span><i style="--c:var(--pending)"></i>waiting</span>
          <span><i style="--c:var(--blocked)"></i>blocked</span>
          <span><i style="--c:var(--failed)"></i>failed</span>
          <span><i style="--c:var(--split)"></i>split</span>
        </div>
        <div class="hint" id="graph-hint"><b>drag</b> pan · <b>hover</b> focus · <b>click</b> open</div>
      </div>
    </section>

    <div class="rail">
    <section class="sec butler" aria-labelledby="butler-title">
      <div class="sec-head">
        <h2 id="butler-title">Talk to the run</h2>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" rows="1" aria-label="Message the butler"></textarea>
        <button class="btn" type="submit" id="chat-send">Send</button>
      </form>
      <div class="chat-context" id="chat-context" hidden></div>
    </section>
    </div>

    <section class="sec detail" aria-labelledby="detail-title">
      <div id="detail"><p class="detail-empty">Select a step in the graph to read what it is and what it is doing.</p></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ==================================================================
   Small helpers.
   ================================================================== */
const el = (id) => document.getElementById(id);
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function firstLine(s) {
  return String(s || "").split("\n").map((x) => x.trim()).find(Boolean) || "";
}
function clip(s, n) {
  s = String(s || "");
  return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
}
function shortId(id) {
  if (id === "root") return "root";
  const parts = String(id).split("-");
  const last = parts[parts.length - 1];
  return /^\d+$/.test(last) ? last : clip(id, 7);
}
function nodeName(n) { return firstLine(n && n.goal) || (n && n.id === "root" ? "Your run" : (n && n.id) || "step"); }
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(11, 19);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
let toastTimer = null;
function toast(msg, isErr) {
  const box = el("toast");
  box.textContent = msg;
  box.className = "toast show " + (isErr ? "err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.className = "toast"; }, 5000);
}

async function jget(url) {
  const r = await fetch(url, { headers: { Accept: "application/json" } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.error) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
async function jpost(url, payload) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  return r.json().catch(() => ({ ok: false, error: "HTTP " + r.status }));
}

/* ==================================================================
   State.
   ================================================================== */
let state = null;
let selected = null;
let selectedSig = "";
let detailBusy = false;
let hover = null;
let expanded = new Set();
let layoutKey = "";
let paintKey = "";
let renderedIds = new Set();
let svg = null;
let vb = null;
let home = null;
let hasMoved = false;
let view = { x: 0, y: 0, k: 1 };
let viewport = null;
let suppressClick = false;
let conversation = [];
let chatSig = "";
let chatBusy = false;

const byId = (id) => (state && state.nodes.find((n) => n.id === id)) || null;
const childrenOf = (id) => (state ? state.nodes.filter((n) => (n.parent || null) === (id || null)) : []);

/* The scheduler rule (scheduler.rs deps_satisfied), written as words so the
   sequence is readable without colour. */
function runState(n) {
  if (!n) return { key: "pending", label: "unknown" };
  if (n.status === "running") return { key: "running", label: "running now" };
  if (n.status === "complete") return { key: "complete", label: "done" };
  if (n.status === "failed") return { key: "failed", label: "failed" };
  if (n.status === "split") return { key: "split", label: "split into steps" };
  if (n.status === "suspended") return { key: "suspended", label: "blocked" };
  const outstanding = (n.depends_on || []).filter((d) => {
    const dep = byId(d);
    return !dep || dep.status !== "complete" || dep.stale;
  });
  if (outstanding.length) {
    return { key: "waiting", label: "waiting on " + outstanding.map(shortId).join(", "), outstanding };
  }
  return { key: "ready", label: "ready to start" };
}

function stateChip(n) {
  const st = runState(n);
  return `<span class="chip ${esc(st.key)}"><span class="dot"></span>${esc(st.label)}</span>`;
}

/* ==================================================================
   The run: hero heading, now line, progress, top bar.
   ================================================================== */
function renderRun() {
  if (!state) return;
  const c = state.counts || {};
  const total = c.total || state.nodes.length;
  const complete = c.complete || 0;
  const running = state.nodes.filter((n) => n.status === "running");
  const failed = c.failed || 0;
  const ready = state.nodes.filter((n) => runState(n).key === "ready").length;

  el("hero-title").textContent = clip(nodeName({ id: "root", goal: state.root_goal }), 96) || "This run";
  el("progress-fill").style.width = (total ? Math.round((complete / total) * 100) : 0) + "%";

  let now;
  if (running.length) {
    const lead = running[0];
    now = `<span class="pulse-dot"></span><span>Working on <span class="what">${esc(clip(nodeName(lead), 70))}</span></span>` +
      (lead.activity ? `<span>— ${esc(clip(firstLine(lead.activity), 80))}</span>` : "");
  } else if (failed) {
    now = `<span class="what">Stopped with a failure.</span><span>Select the failed step, then ask the butler to retry it.</span>`;
  } else if (total && complete === total) {
    now = `<span class="what">Every step is done.</span>`;
  } else {
    now = `<span class="what">Idle.</span>` +
      (ready ? `<span>${ready} step${ready === 1 ? "" : "s"} can start next.</span>` : "");
  }
  el("hero-now").innerHTML = now;
}

/* ==================================================================
   The graph. Layout: each expanded subtree owns an angular wedge,
   subdivided by leaf weight, every depth on its own ring. Only the root
   is open at first, so the drawing stays legible; a node with hidden
   children opens when clicked. Nodes are circles; colour is the state.
   ================================================================== */
function visibleChildren(n) { return expanded.has(n.id) ? childrenOf(n.id) : []; }
function visibleCount(root) {
  let n = 0;
  const walk = (x) => { n++; visibleChildren(x).forEach(walk); };
  walk(root);
  return n;
}
function layoutSignature() {
  return JSON.stringify(state.nodes.map((n) => [n.id, n.parent, n.depends_on])) + "|" + [...expanded].sort().join(",");
}
function contentSignature() {
  return JSON.stringify(state.nodes.map((n) => [n.id, n.status, n.goal, n.stale, n.activity]));
}
function openChain(id) {
  let cur = byId(id);
  while (cur) {
    if (childrenOf(cur.id).length) expanded.add(cur.id);
    cur = cur.parent ? byId(cur.parent) : null;
  }
}

function renderGraph() {
  const tree = el("tree");
  const root = byId("root") || state.nodes.find((n) => !n.parent);
  if (!root) { tree.innerHTML = '<div class="graph-empty">No root step.</div>'; return; }
  if (expanded.size === 0) expanded.add(root.id);

  const lk = layoutSignature();
  if (lk === layoutKey && tree.querySelector("svg.graph-svg")) { paintGraph(); applyFocus(); return; }
  layoutKey = lk;

  // Never draw an exploded tree: cap the visible nodes.
  while (visibleCount(root) > 72) {
    let deepest = null;
    for (const id of expanded) {
      const n = byId(id);
      if (n && n.id !== root.id && childrenOf(n.id).length) {
        const d = n.depth || 0;
        if (!deepest || d > deepest.d) deepest = { id, d };
      }
    }
    if (!deepest) break;
    expanded.delete(deepest.id);
  }

  // Leaf weight and depth over the visible tree.
  const weight = {}, depth = {};
  (function measure(n, d) {
    depth[n.id] = d;
    const kids = visibleChildren(n);
    if (!kids.length) { weight[n.id] = 1; return 1; }
    let w = 0; kids.forEach((k) => { w += measure(k, d + 1); });
    weight[n.id] = w; return w;
  })(root, 0);
  let maxD = 0;
  for (const id in depth) maxD = Math.max(maxD, depth[id]);

  const ringR = [0];
  for (let d = 1; d <= maxD; d++) ringR[d] = 158 * Math.pow(d, 0.92);

  const pos = {};
  (function place(n, a0, a1, d) {
    const mid = (a0 + a1) / 2;
    const r = ringR[d];
    pos[n.id] = { x: Math.cos(mid) * r, y: Math.sin(mid) * r, angle: mid, depth: d, r };
    const kids = visibleChildren(n);
    const tot = weight[n.id] || 1;
    let cur = a0;
    kids.forEach((k) => {
      const w = (a1 - a0) * (weight[k.id] / tot);
      place(k, cur, cur + w, d + 1);
      cur += w;
    });
  })(root, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2, 0);

  const nodeR = (id) => (id === root.id ? 25 : 18);

  // ---- edges: parent links and dependency links, all drawn, always ----
  const edges = [];
  const deps = [];
  for (const id in pos) {
    const n = byId(id);
    if (!n) continue;
    if (n.parent && pos[n.parent]) {
      const a = pos[n.parent], b = pos[id];
      const mid = (a.r + b.r) / 2;
      const c1x = Math.cos(a.angle) * mid, c1y = Math.sin(a.angle) * mid;
      const c2x = Math.cos(b.angle) * mid, c2y = Math.sin(b.angle) * mid;
      edges.push(`<path class="edge edge-parent" data-to="${esc(id)}" d="M${a.x.toFixed(1)},${a.y.toFixed(1)} C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}" />`);
    }
    for (const dep of (n.depends_on || [])) {
      const a = pos[dep], b = pos[id];
      if (!a || !b) continue;
      const cx = (a.x + b.x) * 0.32, cy = (a.y + b.y) * 0.32;
      deps.push(`<path class="edge edge-dep" data-from="${esc(dep)}" data-to="${esc(id)}" d="M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}" />`);
    }
  }

  // ---- nodes: plain circles ----
  const nextIds = new Set(Object.keys(pos));
  let enterIndex = 0;
  const nodesMarkup = Object.keys(pos).map((id) => {
    const p = pos[id], n = byId(id), st = runState(n);
    const r = nodeR(id);
    const isNew = !renderedIds.has(id) && renderedIds.size > 0;
    return `<g class="gnode ${esc(st.key)}${isNew ? " enter" : ""}${selected === id ? " selected" : ""}" data-id="${esc(id)}" data-st="${esc(st.key)}"
      ${isNew ? `style="--i:${enterIndex++}"` : ""}
      transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})" role="button" tabindex="0"
      aria-label="${esc(nodeName(n))} — ${esc(st.label)}">
      <circle class="halo" r="${(r + 6).toFixed(1)}" />
      <circle class="shape" r="${r.toFixed(1)}" />
      <circle class="hit" r="${(r + 10).toFixed(1)}" />
      ${st.key === "running" ? `<circle class="ring" r="${(r + 8).toFixed(1)}" />` : ""}
    </g>`;
  }).join("");
  renderedIds = nextIds;

  // Provisional viewBox from the node centres only; the real one is measured
  // from the laid-out nodes and their labels right after insertion.
  let pa = Infinity, pb = -Infinity, pc = Infinity, pd = -Infinity;
  for (const id in pos) { const p = pos[id], r = nodeR(id) + 150; pa = Math.min(pa, p.x - r); pb = Math.max(pb, p.x + r); pc = Math.min(pc, p.y - r); pd = Math.max(pd, p.y + r); }
  const provisional = { x: pa, y: pc, w: Math.max(1, pb - pa), h: Math.max(1, pd - pc) };

  tree.innerHTML = `<svg class="graph-svg" viewBox="${provisional.x.toFixed(1)} ${provisional.y.toFixed(1)} ${provisional.w.toFixed(1)} ${provisional.h.toFixed(1)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Run graph">
    <g class="viewport"><g class="edges">${edges.join("")}</g><g class="deps">${deps.join("")}</g><g class="nodes">${nodesMarkup}</g></g>
  </svg>`;
  svg = tree.querySelector("svg.graph-svg");
  viewport = svg.querySelector(".viewport");
  home = measureHome(svg, 38);
  vb = { ...home };
  if (!hasMoved) view = { x: 0, y: 0, k: 1 };
  applyVB();
  applyView();
  paintGraph();
  bindNodes();
  applyFocus();
  applyVB();
  tree.querySelectorAll(".gnode.enter").forEach((g) => setTimeout(() => g.classList.remove("enter"), 900));
}

/* The true bounds of the drawn graph, in user units, read back from the DOM so
   every node is inside the frame by construction. */
function measureHome(svg, pad) {
  const inv = svg.getScreenCTM().inverse();
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  svg.querySelectorAll(".gnode").forEach((g) => {
    const r = g.getBoundingClientRect();
    [[r.left, r.top], [r.right, r.top], [r.left, r.bottom], [r.right, r.bottom]].forEach(([x, y]) => {
      const p = svg.createSVGPoint(); p.x = x; p.y = y;
      const u = p.matrixTransform(inv);
      a = Math.min(a, u.x); b = Math.max(b, u.x); c = Math.min(c, u.y); d = Math.max(d, u.y);
    });
  });
  if (!isFinite(a)) return { x: 0, y: 0, w: 1, h: 1 };
  return { x: a - pad, y: c - pad, w: (b - a) + pad * 2, h: (d - c) + pad * 2 };
}

function applyVB() { if (svg && vb) svg.setAttribute("viewBox", `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`); }
function applyView() { if (viewport) viewport.setAttribute("transform", `translate(${view.x.toFixed(2)} ${view.y.toFixed(2)}) scale(${view.k.toFixed(4)})`); }

/* Update status colouring without rebuilding the tree, so a poll never
   flickers the graph or drops the hover. */
function paintGraph() {
  const tree = el("tree");
  tree.querySelectorAll(".gnode").forEach((g) => {
    const n = byId(g.dataset.id);
    if (!n) return;
    const st = runState(n);
    const prev = g.dataset.st;
    g.dataset.st = st.key;
    const isNew = g.classList.contains("enter");
    const changed = prev && prev !== st.key;
    g.setAttribute("class", `gnode ${st.key}${isNew ? " enter" : ""}${selected === g.dataset.id ? " selected" : ""}` +
      `${hover === g.dataset.id ? " hover" : ""}${changed ? " change" : ""}`);
    if (changed) setTimeout(() => g.classList.remove("change"), 800);
  });
  tree.querySelectorAll(".edge-parent").forEach((p) => {
    const n = byId(p.dataset.to);
    const st = n ? runState(n).key : "pending";
    const cls = st === "running" ? "edge-running" : st === "complete" ? "edge-complete" : st === "failed" ? "edge-failed" : "";
    p.setAttribute("class", "edge edge-parent " + cls);
  });
  applyFocus();
  paintKey = contentSignature();
}

/* ==================================================================
   Graph interaction: hover focus, click select, pinch, pan.
   ================================================================== */
function bindNodes() {
  const tree = el("tree");
  tree.querySelectorAll(".gnode").forEach((g) => {
    g.addEventListener("click", () => {
      if (suppressClick) { suppressClick = false; return; }
      selectNode(g.dataset.id);
    });
    if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      g.addEventListener("mouseenter", () => { hover = g.dataset.id; applyFocus(); });
      g.addEventListener("mouseleave", () => { if (hover === g.dataset.id) { hover = null; applyFocus(); } });
    }
    g.addEventListener("focus", () => { hover = g.dataset.id; applyFocus(); });
    g.addEventListener("blur", () => { if (hover === g.dataset.id) { hover = null; applyFocus(); } });
    g.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectNode(g.dataset.id); }
    });
  });
}

function applyFocus() {
  if (!svg) return;
  // Focus (and the dimming of everything else) is a hover-only effect, so the
  // full graph reads at a glance by default; selection only marks the node.
  const id = hover;
  const path = new Set();
  for (let cur = id ? byId(id) : null; cur; cur = cur.parent ? byId(cur.parent) : null) path.add(cur.id);
  svg.classList.toggle("svg-focus", !!id);
  svg.querySelectorAll(".gnode").forEach((g) => {
    const gid = g.dataset.id;
    g.classList.toggle("selected", gid === selected);
    g.classList.toggle("hover", gid === hover);
    g.classList.toggle("dim", !!id && !path.has(gid) && gid !== id);
  });
  svg.querySelectorAll(".edge-parent, .edge-dep").forEach((p) => {
    const to = p.dataset.to, from = p.dataset.from || (byId(to) && byId(to).parent);
    p.classList.toggle("onpath", !!id && path.has(to) && !!from && path.has(from));
  });
  const hint = el("graph-hint");
  if (hint) {
    const h = byId(hover);
    hint.innerHTML = h ? `<b>${esc(nodeName(h))}</b> — ${esc(runState(h).label)}` : "<b>drag</b> pan · <b>hover</b> focus · <b>click</b> open";
  }
}

function selectNode(id) {
  const n = byId(id);
  if (!n) return;
  if (childrenOf(id).length) {
    if (expanded.has(id) && selected === id) expanded.delete(id);
    else expanded.add(id);
  }
  selected = id;
  selectedSig = "";
  layoutKey = "";
  renderGraph();
  setContext(id);
  tickDetail(true);
}

/* ---------- pan / pinch / reset ---------- */
function toUser(x, y) {
  const pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function zoomAt(factor, x, y) {
  if (!svg || !viewport) return;
  const k = view.k * factor;
  if (k < 0.55 || k > 18) return;
  const p = toUser(x, y);
  view.x = p.x - (p.x - view.x) * factor;
  view.y = p.y - (p.y - view.y) * factor;
  view.k = k;
  hasMoved = true;
  applyView();
}
let resetAnim = null;
function resetView(animate) {
  if (!viewport) return;
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { view = { x: 0, y: 0, k: 1 }; hasMoved = false; applyView(); return; }
  const from = { ...view }, t0 = performance.now(), dur = 280;
  cancelAnimationFrame(resetAnim);
  const step = (now) => {
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    view.x = from.x * (1 - e); view.y = from.y * (1 - e); view.k = from.k + (1 - from.k) * e;
    applyView();
    if (t < 1) resetAnim = requestAnimationFrame(step);
    else hasMoved = false;
  };
  resetAnim = requestAnimationFrame(step);
}

function bindGraphInteraction() {
  const frame = el("graph-frame");
  const pointers = new Map();
  let panning = false, moved = false, lastX = 0, lastY = 0, pinchDist = 0;

  frame.addEventListener("dblclick", (ev) => {
    if (!ev.target.closest("svg.graph-svg")) return;
    resetView(true);
  });

  frame.addEventListener("pointerdown", (ev) => {
    if (!svg || !ev.target.closest("svg.graph-svg")) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size === 1) { panning = true; moved = false; lastX = ev.clientX; lastY = ev.clientY; svg.classList.add("panning"); }
    else if (pointers.size === 2) { panning = false; const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
  });

  frame.addEventListener("pointermove", (ev) => {
    if (!pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) zoomAt(pinchDist / d, (a.x + b.x) / 2, (a.y + b.y) / 2);
      pinchDist = d; moved = true;
      return;
    }
    if (!panning) return;
    const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
    // Capture only once a real drag begins, so a plain click still reaches
    // the node (pointer capture would retarget its click event to the frame).
    if (!moved && Math.hypot(dx, dy) > 4) {
      moved = true;
      try { frame.setPointerCapture(ev.pointerId); } catch (e) { /* fine */ }
    }
    lastX = ev.clientX; lastY = ev.clientY;
    if (!moved || !vb) return;
    const m = svg.getScreenCTM();
    if (!m || !m.a || !m.d) return;
    // Direct manipulation: the graph moves with the pointer.
    view.x += dx / m.a; view.y += dy / m.d; hasMoved = true;
    applyView();
  });

  const end = (ev) => {
    pointers.delete(ev.pointerId);
    if (pointers.size === 0) {
      panning = false; pinchDist = 0;
      if (svg) svg.classList.remove("panning");
      if (moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 60); moved = false; }
    }
  };
  frame.addEventListener("pointerup", end);
  frame.addEventListener("pointercancel", end);
}

/* ==================================================================
   The butler conversation — the only steering surface. The selected
   node rides along as context so "reopen this" is unambiguous.
   ================================================================== */
const ACTION_WORD = { none: "No change needed", reopen: "Reopened", split: "Added steps", amend: "Amended", edit_contract: "Edited the contract", retry: "Retried", resolve: "Settled" };
function conversationSig() {
  return JSON.stringify(conversation.map((t) => [t.id, t.status, (t.reply || "").length, t.error || "", t.plan && t.plan.rationale, (t.tree_changes || []).length]));
}
function renderTurn(t) {
  const user = `<div class="msg user">${esc(t.message)}</div>`;
  let butler;
  if (t.status === "working") {
    butler = `<div class="msg butler working"><span class="wdots"><i></i><i></i><i></i></span>Reading the run and making the smallest correct change…</div>`;
  } else if (t.status === "failed") {
    butler = `<div class="msg butler err"><b>That request failed.</b> ${esc(t.error || "unknown error")}</div>`;
  } else {
    butler = renderReply(t);
  }
  return `<div class="turn">${user}${butler}</div>`;
}
function renderReply(t) {
  const plan = t.plan || {};
  const action = plan.action || "none";
  const nodes = plan.nodes || [];
  const changes = t.tree_changes || [];
  const head = `<div class="plan-head">
      <span class="plan-action ${esc(action)}">${esc(ACTION_WORD[action] || action)}</span>
      ${nodes.length ? `<span class="plan-nodes">${nodes.map(esc).join(", ")}</span>` : ""}
    </div>`;
  const why = plan.rationale ? `<div class="plan-why">${esc(plan.rationale)}</div>` : "";
  const changeList = changes.length
    ? `<div class="changes"><div class="changes-title">Changed in the run</div>${changes.map((c) => `<div class="change">${esc(c.id)} · ${esc(c.from)} → ${esc(c.to)}</div>`).join("")}</div>`
    : "";
  const notes = t.reply ? `<details class="reply"><summary>Full reply</summary><pre>${esc(t.reply)}</pre></details>` : "";
  return `<div class="msg butler">${head}${why}${changeList}${notes}</div>`;
}
function renderChat(force) {
  const log = el("chat-log");
  if (!log) return;
  const sig = conversationSig();
  if (!force && sig === chatSig) return;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 48;
  chatSig = sig;
  log.innerHTML = conversation.length
    ? conversation.map(renderTurn).join("")
    : '<p class="chat-empty">No messages yet.</p>';
  const last = conversation[conversation.length - 1];
  chatBusy = !!(last && last.status === "working");
  const send = el("chat-send");
  if (send) send.disabled = chatBusy;
  if (force || atBottom) log.scrollTop = log.scrollHeight;
}
async function pollConversation(force) {
  try {
    const data = await jget("/api/butler");
    conversation = data.turns || [];
    renderChat(force);
  } catch (err) {
    if (force) toast("Could not load the conversation — " + err, true);
  }
}
async function sendChat(ev) {
  if (ev) ev.preventDefault();
  const input = el("chat-input");
  const message = (input.value || "").trim();
  if (!message || chatBusy) return;
  const send = el("chat-send");
  send.disabled = true;
  try {
    const payload = { message };
    if (selected) payload.node = selected;
    const res = await jpost("/api/butler", payload);
    if (res && res.ok) {
      input.value = ""; input.style.height = "";
      await pollConversation(true);
    } else {
      toast((res && res.error) || "the butler could not start", true);
      send.disabled = false;
    }
  } catch (err) {
    toast("Request failed — " + err, true);
    send.disabled = false;
  }
}
function setContext(id) {
  const n = byId(id);
  const box = el("chat-context");
  if (!box) return;
  if (!n) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = `about <span class="ctx">${esc(clip(nodeName(n), 70))}</span> <button type="button" id="ctx-clear" aria-label="Clear the selected step">clear</button>`;
}

/* ==================================================================
   Node detail — strictly read-only: description and live events.
   ================================================================== */
function listOr(items, render) {
  if (!items || !items.length) return '<div class="empty">none</div>';
  return `<ul class="clean">${items.map((i) => `<li>${render ? render(i) : esc(i)}</li>`).join("")}</ul>`;
}
function diffLineClass(line) {
  if (line.startsWith("diff --git ") || line.startsWith("diff --cc ")) return "file";
  if (line.startsWith("@@")) return "hunk";
  if (line.startsWith("+++") || line.startsWith("---")) return "head";
  if (line.startsWith("+")) return "add";
  if (line.startsWith("-")) return "del";
  if (/^(commit |Merge:|Author:|Date:|    |index |new file|deleted file|similarity |rename |old mode|new mode|Binary files|GIT binary patch)/.test(line)) return "meta";
  return "ctx";
}
function renderDiff(diff) {
  if (!diff || !diff.trim()) return '<pre class="diff-box"><span class="diffline ctx">(nothing committed for this step)</span></pre>';
  const body = String(diff).replace(/\n$/, "").split("\n").map((line) => `<span class="diffline ${diffLineClass(line)}">${esc(line)}</span>`).join("");
  return `<pre class="diff-box">${body}</pre>`;
}
function eventSummary(e) {
  if (!e) return "";
  for (const k of ["error", "reason", "detail", "summary", "message", "assumption", "payload"]) {
    if (e[k] != null && e[k] !== "") return typeof e[k] === "string" ? e[k] : JSON.stringify(e[k]);
  }
  return Object.entries(e).filter(([k, v]) => !["at", "node", "event"].includes(k) && v != null && typeof v !== "object").map(([k, v]) => k + "=" + v).join("  ");
}
function eventList(events) {
  if (!events || !events.length) return '<div class="empty">No output recorded yet.</div>';
  return `<div class="events">${events.map((e) => {
    const name = (e && e.event) || "event";
    const bad = name === "error" || (e && e.error) || /fail|revert|tamper|exhaust/.test(name);
    return `<div class="event ${bad ? "err" : ""}">
      <time>${esc(when(e && e.at))}</time>
      <span class="name">${esc(name)}</span>
      <span class="msg">${esc(clip(eventSummary(e), 500))}</span>
    </div>`;
  }).join("")}</div>`;
}
function renderDetail(n) {
  const parent = n.parent ? byId(n.parent) : null;
  const criteria = n.acceptance_criteria || [];
  const events = n.events || [];
  return `
    <div class="detail-head">
      <div style="min-width:0">
        <h2>${esc(nodeName(n))}</h2>
        <div class="meta">${esc(n.id)} · depth ${esc(n.depth)}${parent ? ` · inside <b>${esc(clip(nodeName(parent), 48))}</b>` : ""}</div>
      </div>
      ${stateChip(n)}
    </div>
    <div class="detail-grid">
      <div class="detail-block">
        <h4>Doing now</h4>
        <div class="detail-act ${n.status === "running" ? "live" : ""}">${esc(n.activity || (n.status === "running" ? "starting…" : "No live output for this step."))}</div>
      </div>
      <div class="detail-block">
        <h4>What it is</h4>
        <div class="prose">${esc(n.goal || nodeName(n))}</div>
      </div>
      ${criteria.length ? `<div class="detail-block"><h4>Done when</h4>${listOr(criteria)}</div>` : ""}
      <div class="detail-block">
        <h4>Live events</h4>
        ${eventList(events)}
      </div>
      <div class="detail-block">
        <details class="code"><summary>Code changes</summary>${renderDiff(n.diff)}</details>
      </div>
    </div>`;
}
async function tickDetail(force) {
  const box = el("detail");
  if (!selected) {
    box.innerHTML = '<p class="detail-empty">Select a step in the graph to read what it is and what it is doing.</p>';
    return;
  }
  if (detailBusy) return;
  detailBusy = true;
  try {
    const n = await jget("/api/node?id=" + encodeURIComponent(selected));
    const sig = JSON.stringify([n.status, n.activity, n.depth, (n.events || []).length, (n.diff || "").length]);
    if (force || sig !== selectedSig) { selectedSig = sig; box.innerHTML = renderDetail(n); }
  } catch (err) {
    box.innerHTML = `<p class="detail-empty">Could not load ${esc(selected)} — ${esc(err)}</p>`;
  } finally {
    detailBusy = false;
  }
}

/* ==================================================================
   Poll loop.
   ================================================================== */
function setLive(status) {
  el("live").className = "live " + (status === "ok" ? "busy" : status === "off" ? "off" : "");
  el("liveText").textContent = status === "ok" ? "live" : status === "off" ? "disconnected" : "connecting…";
}
async function tick(force) {
  try {
    state = await jget("/api/state");
    setLive("ok");
    const present = new Set(state.nodes.map((n) => n.id));
    for (const id of [...expanded]) if (!present.has(id)) expanded.delete(id);
    renderRun();
    renderGraph();
    const cs = contentSignature();
    if (cs !== paintKey) paintGraph();
    if (!selected && state.nodes.length) {
      selected = (byId("root") || state.nodes[0]).id;
      openChain(selected);
      layoutKey = "";
      renderGraph();
      setContext(selected);
    }
    await tickDetail(force);
  } catch (err) {
    setLive("off");
    if (!state) {
      el("hero-now").textContent = "Disconnected — retrying.";
      el("tree").innerHTML = '<div class="graph-empty">No state available.</div>';
    }
  }
  await pollConversation(false);
}

/* ==================================================================
   Wiring.
   ================================================================== */
document.addEventListener("click", (ev) => {
  if (ev.target.closest("#ctx-clear")) { setContext(null); return; }
});
el("chat-form").addEventListener("submit", sendChat);
el("chat-input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); el("chat-form").requestSubmit(); }
});
el("chat-input").addEventListener("input", (ev) => {
  const t = ev.target;
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 180) + "px";
});
window.addEventListener("resize", () => {
  if (!home || !svg || hasMoved) return;
  vb = { ...home };
  applyVB();
});

bindGraphInteraction();
setInterval(() => tick(false), 2000);
tick(true);
pollConversation(true);
</script>
</body>
</html>
