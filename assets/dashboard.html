<body>
  <header class="appbar">
    <span class="brand"><span class="spark">◆</span> fractal</span>
    <span class="project" id="project" title=""></span>
    <span class="spacer"></span>
    <span class="live off" id="live"><span class="pulse"></span><span id="liveText">connecting…</span></span>
  </header>

  <div class="wrap">
    <section class="overview" id="overview">
      <div class="state-note">Loading run state…</div>
    </section>
    <section class="panel graph-panel">
      <div class="panel-head">
        <h2>Task graph</h2>
        <div class="gtools">
          <label class="gtoggle" title="Draw every depends_on edge. Off, only the hovered or selected node's dependencies are drawn, so the graph stays readable.">
            <input type="checkbox" id="show-deps" /> All dependencies
          </label>
          <div class="zoomctl" role="group" aria-label="Zoom">
            <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
            <span class="sep"></span>
            <button type="button" id="zoom-fit" title="Fit to view" aria-label="Fit to view">⤢</button>
            <span class="sep"></span>
            <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          </div>
          <div class="viewtoggle" role="group" aria-label="Tree view">
            <button type="button" id="view-graph" class="active" aria-pressed="true">Graph</button>
            <button type="button" id="view-rows" aria-pressed="false">Rows</button>
          </div>
        </div>
        <span class="muted" id="treeCount"></span>
      </div>
      <div class="legend" id="legend">
        <span class="item"><span class="swatch parent"></span>parent → child</span>
        <span class="item"><span class="swatch dep"></span>depends on</span>
        <span class="item"><span class="swatch active"></span>active path</span>
        <span class="item"><span class="swatch complete"></span>done</span>
        <span class="item"><span class="swatch failed"></span>failed</span>
        <span class="item"><span class="swatch pending"></span>waiting</span>
        <span class="item hint">hover a node for its dependencies</span>
      </div>
      <div class="nextup" id="nextup" aria-live="polite"></div>
      <div class="graph-scroll" id="graph-scroll">
        <div class="graph" id="tree"><div class="state-note">Waiting for nodes…</div></div>
      </div>
    </section>
    <section class="panel detail" id="detail">
      <div class="state-note">Select a node to see its contract, activity and controls.</div>
    </section>
  </div>

  <div class="gtt" id="gtt" role="tooltip" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const el = (id) => document.getElementById(id);
const STATUS_ORDER = ["complete", "running", "failed", "split", "suspended", "pending"];

let state = null;
let selected = null;
let selectedSig = "";
let detailBusy = false;
let showDeps = false;
/* The last steering result persists across poll re-renders so the user is never
   left guessing whether an action landed; `highlight` marks the text it added. */
let lastAction = null;
let highlight = null;
/* Graph interaction state: the node under the cursor, the built SVG and its
   viewBox (so zoom/pan can adjust it), and a cache signature so the 2s poll
   does not thrash a graph whose structure has not changed. */
let hover = null;
let graphAPI = null;
let graphSig = "";
let suppressClick = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function firstLine(s) {
  return String(s || "").split("\n").map((x) => x.trim()).find(Boolean) || "";
}
function clip(s, n) {
  s = String(s || "");
  return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
}
function shortId(id) {
  if (id === "root") return "root";
  const parts = String(id).split("-");
  const last = parts[parts.length - 1];
  return /^\d+$/.test(last) ? last : clip(id, 7);
}
function nodeName(n) {
  return firstLine(n && n.goal) || (n && n.id === "root" ? "Project goal" : (n && n.id) || "node");
}
function statusLabel(s) {
  return String(s || "pending").replace(/_/g, " ");
}
function chip(status, withDot) {
  const s = status || "pending";
  return `<span class="chip ${esc(s)}">${withDot === false ? "" : '<span class="doto"></span>'}${esc(statusLabel(s))}</span>`;
}
/* The chip that names run state (ready / running / waiting on <ids> / done /
   failed). It is the primary readout; colour is a secondary cue. */
function stateChip(n) {
  const st = runState(n);
  return `<span class="chip ${esc(st.key)}" title="${esc(st.label)}"><span class="doto"></span>${esc(st.label)}</span>`;
}
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(11, 19);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

const byId = (id) => (state && state.nodes.find((n) => n.id === id)) || null;
const childrenOf = (id) =>
  (state ? state.nodes.filter((n) => (n.parent || null) === (id || null)) : []);

/* Run state answers "can this run now?". It mirrors the scheduler's rule
   (scheduler.rs `deps_satisfied`): a pending node is runnable once every
   depends_on target is complete and not stale. Any other status keeps its
   own name. Waiting names the exact ids still outstanding, so sequence and
   parallelism are readable from the text alone. */
function runState(n) {
  if (!n) return { key: "pending", label: "unknown" };
  if (n.status === "running") return { key: "running", label: "running" };
  if (n.status === "complete") return { key: "complete", label: "done" };
  if (n.status === "failed") return { key: "failed", label: "failed" };
  if (n.status === "split") return { key: "split", label: "split" };
  if (n.status === "suspended") return { key: "suspended", label: "suspended" };
  const outstanding = (n.depends_on || []).filter((d) => {
    const dep = byId(d);
    return !dep || dep.status !== "complete" || dep.stale;
  });
  if (outstanding.length) {
    return { key: "waiting", label: "waiting on " + outstanding.map(shortId).join(", "), outstanding };
  }
  return { key: "ready", label: "ready" };
}
function readyNodes() {
  return state ? state.nodes.filter((n) => runState(n).key === "ready") : [];
}
function descendantsOf(id) {
  const out = [];
  const walk = (pid) => childrenOf(pid).forEach((c) => { out.push(c); walk(c.id); });
  walk(id);
  return out;
}

/* ---------- data ---------- */
async function jget(url) {
  const r = await fetch(url, { headers: { Accept: "application/json" } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.error) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
async function jpost(action) {
  const r = await fetch("/api/action", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(action),
  });
  return r.json().catch(() => ({ ok: false, error: "HTTP " + r.status }));
}

let toastTimer = null;
function toast(msg, isErr) {
  const box = el("toast");
  box.textContent = msg;
  box.className = "toast show " + (isErr ? "err" : "ok");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.className = "toast"; }, 5000);
}

/* ---------- overview ---------- */
function renderOverview() {
  const c = (state && state.counts) || {};
  const total = c.total || (state ? state.nodes.length : 0) || 0;
  const complete = c.complete || 0;
  const refused = (state && state.trace && state.trace.refused) || 0;
  const overall = (state && state.overall_status) || (state && state.root_status) || "pending";
  const rootGoal = (state && (state.root_goal || (byId("root") || {}).goal)) || "this project";
  const pct = total ? Math.round((complete / total) * 100) : 0;

  const running = state ? state.nodes.filter((n) => n.status === "running") : [];
  const lead = running[0] || null;
  const now = lead
    ? `<div class="nowrunning">
         <span class="label">● Now running</span>
         <span class="who">${esc(nodeName(lead))}</span>
         <span class="act" title="${esc(lead.activity || "")}">${esc(lead.activity || "starting…")}</span>
       </div>`
    : `<div class="nowrunning idle">
         <span class="label">Run</span>
         <span class="act">${state && state.nodes.some((n) => n.status === "failed")
            ? "Stopped with failures. Select a failed node to retry it or steer the tree below."
            : "No node is running right now."}</span>
       </div>`;

  el("overview").innerHTML = `
    <div class="overview-top">
      <div class="overview-goal">
        <div class="eyebrow">Overall goal</div>
        <h1 class="goal-title" title="${esc(rootGoal)}">${esc(rootGoal)}</h1>
        <div class="goal-sub">${esc(state ? state.project : "")}</div>
      </div>
      <div class="stats">
        ${stat("complete", complete, "complete")}
        ${stat("running", c.running || 0, "running")}
        ${stat("pending", c.pending || 0, "pending")}
        ${stat("failed", c.failed || 0, "failed")}
        ${stat("split", c.split || 0, "split")}
        ${stat("refused", refused, "refused")}
      </div>
    </div>
    <div class="progress">
      <div class="progress-head">
        <span><strong style="color:var(--text)">${complete}</strong> of ${total} nodes complete</span>
        <span>${chip(overall)}</span>
      </div>
      <div class="bar"><span style="width:${pct}%"></span></div>
    </div>
    ${now}`;
}
function stat(kind, n, label) {
  return `<div class="stat is-${kind}"><div class="n">${n}</div><div class="k">${label}</div></div>`;
}

/* ---------- task graph ---------- */
let view = "graph";

function renderTree() {
  el("treeCount").textContent = state ? state.nodes.length + (state.nodes.length === 1 ? " node" : " nodes") : "";
  el("show-deps").checked = showDeps;
  renderNextUp();
  if (!state || !state.nodes.length) {
    el("tree").innerHTML = '<div class="state-note">No nodes yet. This project has not been initialised.</div>';
    return;
  }
  if (view === "rows") {
    renderRows();
    bindNodeEvents();
    applyFocus();
  } else {
    const rebuilt = renderGraph();
    if (rebuilt) bindNodeEvents();
    applyFocus();
  }
}

/* "Next up" is the set of nodes that can start right now: pending with every
   dependency complete. That, plus each node's run-state text, is how a viewer
   sees what runs in parallel and what the sequence is. */
function renderNextUp() {
  const bar = el("nextup");
  if (!state || !state.nodes.length) { bar.className = "nextup idle"; bar.innerHTML = ""; return; }
  const ready = readyNodes();
  const running = state.nodes.filter((n) => n.status === "running");
  if (ready.length) {
    const shown = ready.slice(0, 6).map((n) => `<span class="who" title="${esc(n.id)}">${esc(nodeName(n))}</span>`);
    const more = ready.length > shown.length ? ` <span class="count">+${ready.length - shown.length} more</span>` : "";
    bar.className = "nextup";
    bar.innerHTML = `<span class="label">Next up</span><span class="who">${shown.join('<span class="sep"> · </span>')}</span>${more}`;
    return;
  }
  bar.className = "nextup idle";
  if (running.length) {
    bar.innerHTML = `<span class="label">Next up</span><span class="note">Nothing new can start until the running node finishes.</span>`;
  } else if (state.nodes.some((n) => n.status === "failed")) {
    bar.innerHTML = `<span class="label">Next up</span><span class="note">A node failed. Nothing will start until it is retried or steered.</span>`;
  } else if (state.nodes.every((n) => n.status === "complete")) {
    bar.innerHTML = `<span class="label">Next up</span><span class="note">All nodes are done.</span>`;
  } else {
    bar.innerHTML = `<span class="label">Next up</span><span class="note">No node is runnable — every pending node is waiting on a dependency.</span>`;
  }
}

function renderRows() {
  el("graph-scroll").classList.remove("graph-view");
  const build = (nodes) => {
    if (!nodes.length) return "";
    return `<ul>${nodes.map((n) => {
      const kids = childrenOf(n.id);
      const badges =
        (n.stale ? ' <span class="badge warn">stale</span>' : "") +
        (n.tampered ? ' <span class="badge bad">tampered</span>' : "");
      const activity = n.activity
        ? `<div class="row-activity" title="${esc(n.activity)}">${esc(clip(n.activity, 120))}</div>`
        : "";
      return `<li>
        <button class="row ${n.status === "running" ? "running" : ""} ${selected === n.id ? "selected" : ""}"
                data-id="${esc(n.id)}" title="${esc(n.id)}\n${esc(n.goal || "")}">
          <span class="doto" style="background:var(--${esc(n.status)},var(--pending))"></span>
          <span class="row-main">
            <span class="row-title">${esc(nodeName(n))}</span>
            ${activity}
          </span>
          <span style="display:flex;align-items:center;gap:6px;flex:none">${stateChip(n)}<span class="row-tag">${esc(shortId(n.id))}</span></span>
        </button>
        ${build(kids)}
      </li>`;
    }).join("")}</ul>`;
  };
  const root = byId("root");
  const top = root ? [root] : state.nodes.filter((n) => !n.parent);
  el("tree").innerHTML = build(top) || '<div class="state-note">No nodes.</div>';
  el("tree").style.width = "";
  el("tree").style.height = "";
}

/* Edge state rules:
   - a parent edge carries the child's status;
   - a dependency edge is failed if the node it feeds failed, active while the
     dependent (or the dependency itself) is running, complete once the
     dependency is done, and waiting otherwise. Every state is also named in
     the legend, so colour is never the only carrier. */
function edgeState(status) {
  if (status === "failed") return "failed";
  if (status === "running") return "active";
  if (status === "complete") return "complete";
  return "pending";
}
function depEdgeState(dep, node) {
  if (node.status === "failed" || dep.status === "failed") return "failed";
  if (node.status === "running" || dep.status === "running") return "active";
  if (dep.status === "complete") return "complete";
  return "pending";
}

/* ------------------------------------------------------------------
   The fractal radial layout.

   Each subtree owns an angular wedge of the circle, subdivided by leaf
   weight as you descend. Every level sits on its own ring, and both the
   ring spacing and the node size shrink by the same ratio at every step,
   so the pattern repeats at every scale: a self-similar, recursive
   structure that reads as one organic object. The whole thing is a single
   SVG with a computed viewBox, so it always fits the viewport - no
   horizontal scrolling, whatever the node count.

   Descendency is always drawn. Dependency edges are the ones that make a
   dense graph unreadable, so they stay hidden until a node is hovered or
   selected (or the All dependencies toggle is on).
   ------------------------------------------------------------------ */
const GLYPH = { complete: "✓", running: "●", ready: "◇", waiting: "·", failed: "✕", split: "◆", suspended: "≡", pending: "○" };
const STATUS_WORD = { complete: "done", running: "run", ready: "ready", waiting: "wait", failed: "failed", split: "split", suspended: "held", pending: "pending" };

function graphSignature() {
  return JSON.stringify(state.nodes.map((n) => [n.id, n.parent, n.depth, n.status, n.goal, n.depends_on, n.stale, n.tampered]));
}

function renderGraph() {
  const tree = el("tree");
  const scroll = el("graph-scroll");
  const nodes = state.nodes;
  const root = byId("root") || nodes.find((n) => !n.parent);
  if (!root) { tree.innerHTML = '<div class="state-note">No root node.</div>'; return true; }
  scroll.classList.add("graph-view");

  const sig = graphSignature();
  if (sig === graphSig && tree.querySelector("svg.graph-svg") && graphAPI) {
    return false; // structure unchanged: keep zoom/pan, just refresh focus
  }
  graphSig = sig;
  hover = null;
  hideTooltip();

  // Leaf weight: how much of the circle a subtree deserves.
  const weight = {};
  (function measure(n) {
    const kids = childrenOf(n.id);
    if (!kids.length) { weight[n.id] = 1; return 1; }
    let w = 0;
    kids.forEach((k) => { w += measure(k); });
    weight[n.id] = w;
    return w;
  })(root);

  let maxDepth = 0;
  (function depth(n, d) { if (d > maxDepth) maxDepth = d; childrenOf(n.id).forEach((k) => depth(k, d + 1)); })(root, 0);

  // Rings tighten as they go out (radius ~ d^p), and both node and type size
  // shrink on the same curve, so the pattern repeats at every scale instead of
  // a deep chain stretching to infinity.
  const S = 0.82;
  const ringR = [0];
  for (let d = 1; d <= maxDepth; d++) ringR[d] = 92 * Math.pow(d, 0.72);
  const maxR = Math.max(ringR[maxDepth], 1);
  const baseNodeR = (d) => Math.max(4.5, 15 * Math.pow(S, d));
  const fsOf = (d) => Math.max(9, 12.5 * Math.pow(0.93, d));

  // Recursive placement: a node's angle is its wedge's bisector.
  const pos = {};
  const place = (n, a0, a1, d) => {
    const span = a1 - a0;
    const mid = (a0 + a1) / 2;
    const r = ringR[d];
    const x = Math.cos(mid) * r, y = Math.sin(mid) * r;
    const arc = Math.max(0.001, r * span);
    // Never wider than its own wedge's arc can hold: crowded siblings simply
    // render smaller instead of overlapping.
    let nodeR = d === 0 ? 13 : Math.min(baseNodeR(d), 0.34 * arc);
    nodeR = Math.max(3.6, nodeR);
    pos[n.id] = { x, y, angle: mid, a0, a1, span, r, nodeR, depth: d };
    const kids = childrenOf(n.id);
    const tot = weight[n.id] || 1;
    let cursor = a0;
    kids.forEach((k) => {
      const w = span * (weight[k.id] / tot);
      place(k, cursor, cursor + w, d + 1);
      cursor += w;
    });
  };
  place(root, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2, 0);

  // Labels. A candidate label is resolved against every other node dot and
  // every already-placed label: shallow nodes keep their goal line, deeper
  // nodes fall back to id + status, and a label that would still collide is
  // hidden entirely (the tooltip always has goal, status and counts).
  const labels = {};
  for (const id in pos) {
    const p = pos[id];
    const n = byId(id);
    const st = runState(n);
    const fs = fsOf(p.depth);
    const arc = Math.max(0.001, p.r * p.span);
    const maxLen = Math.floor(arc / (fs * 0.58));
    const idTxt = shortId(id);
    const statusWord = STATUS_WORD[st.key] || st.key;
    let goalTxt = "";
    if (p.depth > 0 && p.depth <= 2 && maxLen >= 16) {
      goalTxt = clip(nodeName(n), Math.max(10, Math.min(22, maxLen - idTxt.length - statusWord.length - 2)));
      if (goalTxt.length < 8) goalTxt = "";
    }
    labels[id] = { fs, idTxt, statusWord, goalTxt, st: st, x: null, two: false };
  }

  const occupied = [];
  for (const id in pos) {
    const p = pos[id];
    occupied.push([p.x - p.nodeR - 2, p.x + p.nodeR + 2, p.y - p.nodeR - 2, p.y + p.nodeR + 2]);
  }
  const hits = (b) => occupied.some((o) => !(b[1] < o[0] || b[0] > o[1] || b[3] < o[2] || b[2] > o[3]));
  const byDepth = Object.keys(pos).sort((a, b) => pos[a].depth - pos[b].depth);
  for (const id of byDepth) {
    const p = pos[id], L = labels[id];
    const right = p.x >= 0;
    const x = right ? p.x + p.nodeR + 7 : p.x - p.nodeR - 7;
    const idLen = L.idTxt.length + L.statusWord.length + 1;
    const idW = idLen * L.fs * 0.58;
    const idBox = right ? [x, x + idW, p.y - L.fs * 0.6, p.y + L.fs * 0.6] : [x - idW, x, p.y - L.fs * 0.6, p.y + L.fs * 0.6];
    if (L.goalTxt) {
      const w = Math.max(idLen, L.goalTxt.length) * L.fs * 0.58;
      const gBox = right ? [x, x + w, p.y - L.fs * 1.0, p.y + L.fs * 1.0] : [x - w, x, p.y - L.fs * 1.0, p.y + L.fs * 1.0];
      if (!hits(gBox)) { occupied.push(gBox); L.x = x; L.two = true; continue; }
      L.goalTxt = "";
    }
    if (!hits(idBox)) { occupied.push(idBox); L.x = x; L.two = false; }
    else { labels[id] = null; }
  }

  // The viewBox is the bounding box of every dot and every label that survived.
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const b of occupied) {
    if (b[0] < minX) minX = b[0];
    if (b[1] > maxX) maxX = b[1];
    if (b[2] < minY) minY = b[2];
    if (b[3] > maxY) maxY = b[3];
  }

  // The active path: every running node plus its ancestors.
  const activeIds = new Set();
  for (const n of nodes) {
    if (n.status !== "running") continue;
    for (let cur = n; cur; cur = cur.parent ? byId(cur.parent) : null) activeIds.add(cur.id);
  }
  const pathStateOf = (n) => n.status === "failed" ? "failed" : activeIds.has(n.id) ? "active" : edgeState(n.status);

  const parentEdges = [];
  for (const n of nodes) {
    if (!n.parent || !pos[n.parent] || !pos[n.id]) continue;
    const a = pos[n.parent], b = pos[n.id];
    parentEdges.push(`<path class="edge edge-parent edge-${pathStateOf(n)}" data-edge="parent" data-from="${esc(n.parent)}" data-to="${esc(n.id)}" d="M${a.x},${a.y} L${b.x},${b.y}" />`);
  }

  const depEdges = [];
  for (const n of nodes) {
    if (!pos[n.id]) continue;
    (n.depends_on || []).forEach((d, k) => {
      const dep = byId(d), a = pos[d], b = pos[n.id];
      if (!dep || !a || !b) return;
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const ml = Math.hypot(mx, my) || 1;
      const off = (k % 3 - 1) * 10 + (k > 2 ? k * 4 : 0);
      const cx = mx + (mx / ml) * (ml * 0.3 + 20) + (-dy / len) * off;
      const cy = my + (my / ml) * (ml * 0.3 + 20) + (dx / len) * off;
      const st = n.status === "failed" || dep.status === "failed"
        ? "failed"
        : activeIds.has(n.id) || dep.status === "running"
          ? "active"
          : depEdgeState(dep, n);
      depEdges.push(`<path class="edge edge-dep edge-${st}" data-edge="dep" data-from="${esc(d)}" data-to="${esc(n.id)}" marker-end="url(#arrowDep)" d="M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}" />`);
    });
  }

  // Lattice: concentric rings plus nested sector frames for the first
  // generations - the recursive framing that makes the structure read fractal.
  const lattice = [];
  for (let d = 1; d <= maxDepth; d++) {
    lattice.push(`<circle class="lattice-ring" cx="0" cy="0" r="${ringR[d].toFixed(1)}" />`);
  }
  for (const id in pos) {
    const p = pos[id];
    if (p.depth < 1 || p.depth > 2 || p.span < 0.16) continue;
    const r0 = ringR[p.depth - 1], r1 = ringR[p.depth];
    const x0 = Math.cos(p.a0), y0 = Math.sin(p.a0), x1 = Math.cos(p.a1), y1 = Math.sin(p.a1);
    const large = p.span > Math.PI ? 1 : 0;
    lattice.push(`<path class="lattice-frame" d="M${(x0 * r0).toFixed(1)},${(y0 * r0).toFixed(1)} L${(x0 * r1).toFixed(1)},${(y0 * r1).toFixed(1)} A${r1.toFixed(1)},${r1.toFixed(1)} 0 ${large} 1 ${(x1 * r1).toFixed(1)},${(y1 * r1).toFixed(1)} L${(x1 * r0).toFixed(1)},${(y1 * r0).toFixed(1)}" />`);
  }

  const nodeMarkup = nodes.filter((n) => pos[n.id]).map((n) => {
    const p = pos[n.id], L = labels[n.id];
    const rightHalf = p.x >= 0;
    const anchor = rightHalf ? "start" : "end";
    const glyph = p.nodeR >= 6 ? `<text class="node-glyph" text-anchor="middle" dominant-baseline="central" font-size="${(p.nodeR * 1.05).toFixed(1)}">${GLYPH[runState(n).key] || "○"}</text>` : "";
    let label = "";
    if (L) {
      const x = (L.x - p.x).toFixed(1);
      const y1 = L.two ? (-L.fs * 0.45).toFixed(1) : "0";
      const y2 = (L.fs * 0.7).toFixed(1);
      const goal = L.goalTxt ? `<tspan class="nl-goal" x="${x}" y="${y2}">${esc(L.goalTxt)}</tspan>` : "";
      label = `<text class="node-label" text-anchor="${anchor}" dominant-baseline="central" font-size="${L.fs.toFixed(1)}">
        <tspan class="nl-id" x="${x}" y="${y1}">${esc(L.idTxt)}&#160;</tspan><tspan class="nl-st st-${esc(L.st.key)}" y="${y1}">${esc(L.statusWord)}</tspan>${goal}
      </text>`;
    }
    return `<g class="gnode ${esc(runState(n).key)}${n.status === "running" ? " running" : ""}${selected === n.id ? " selected" : ""}"
      data-id="${esc(n.id)}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"
      role="button" tabindex="0" aria-label="${esc(nodeName(n))} — ${esc(runState(n).label)}">
      <circle class="node-halo" r="${(p.nodeR + 7).toFixed(1)}" />
      <circle class="node-dot" r="${p.nodeR.toFixed(1)}" />
      ${glyph}
      ${label}
    </g>`;
  }).join("");

  const pad = 30;
  const vb = { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2 };

  tree.style.width = "";
  tree.style.height = "";
  tree.innerHTML = `<svg class="graph-svg" viewBox="${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Task graph">
    <defs>
      <marker id="arrowDep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="arrow-dep" />
      </marker>
      <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(217,138,78,.16)" />
        <stop offset="100%" stop-color="rgba(217,138,78,0)" />
      </radialGradient>
    </defs>
    <circle class="lattice-core" cx="0" cy="0" r="${(maxR * 0.5).toFixed(1)}" />
    <g class="lattice">${lattice.join("")}</g>
    <g class="edges">${parentEdges.join("")}${depEdges.join("")}</g>
    <g class="nodes">${nodeMarkup}</g>
  </svg>`;

  const svg = tree.querySelector("svg.graph-svg");
  graphAPI = { svg, vb, home: { x: vb.x, y: vb.y, w: vb.w, h: vb.h } };
  applyViewBox();
  return true;
}

function applyViewBox() {
  if (!graphAPI || !graphAPI.svg) return;
  const v = graphAPI.vb;
  graphAPI.svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
}

/* Focus is one rule set shared by selection and hover: the path from the
   root lights up, and dependency edges appear for the focused node. */
function applyFocus() {
  const tree = el("tree");
  if (!tree) return;
  const id = hover || selected;
  const pathSet = new Set();
  for (let cur = id ? byId(id) : null; cur; cur = cur.parent ? byId(cur.parent) : null) pathSet.add(cur.id);
  tree.querySelectorAll(".edge-parent").forEach((p) => {
    p.classList.toggle("onpath", !!id && pathSet.has(p.dataset.to));
  });
  tree.querySelectorAll(".edge-dep").forEach((p) => {
    const show = showDeps || (!!id && (p.dataset.from === id || p.dataset.to === id));
    p.classList.toggle("show", show);
  });
  tree.querySelectorAll(".gnode").forEach((g) => {
    const gid = g.dataset.id;
    g.classList.toggle("onpath", !!id && pathSet.has(gid) && gid !== id);
    g.classList.toggle("selected", gid === selected);
    g.classList.toggle("hover", gid === hover);
  });
}

/* ---------- node tooltip ---------- */
function positionTooltip(x, y) {
  const t = el("gtt");
  const pad = 14;
  const w = t.offsetWidth || 240, h = t.offsetHeight || 120;
  let left = x + 16, top = y + 16;
  if (left + w > window.innerWidth - 8) left = Math.max(8, x - w - 16);
  if (top + h > window.innerHeight - 8) top = Math.max(8, y - h - 16);
  t.style.left = left + "px";
  t.style.top = top + "px";
}
function showTooltip(id, anchor) {
  const n = byId(id);
  if (!n) return;
  const st = runState(n);
  const deps = (n.depends_on || []).filter((d) => byId(d)).length;
  const dependents = state.nodes.filter((x) => (x.depends_on || []).includes(id)).length;
  const desc = descendantsOf(id).length;
  const t = el("gtt");
  t.innerHTML = `
    <div class="gtt-id mono">${esc(n.id)}</div>
    <div class="gtt-goal">${esc(nodeName(n))}</div>
    <div class="gtt-row">${stateChip(n)}<span class="gtt-metric">depth ${esc(n.depth)}</span></div>
    <div class="gtt-metrics">
      <span>deps <b>${deps}</b></span>
      <span>dependents <b>${dependents}</b></span>
      <span>descendants <b>${desc}</b></span>
    </div>
    ${n.activity ? `<div class="gtt-act">▸ ${esc(clip(n.activity, 150))}</div>` : ""}`;
  t.classList.add("show");
  t.setAttribute("aria-hidden", "false");
  if (anchor) positionTooltip(anchor.x, anchor.y);
}
function hideTooltip() {
  const t = el("gtt");
  if (t) { t.classList.remove("show"); t.setAttribute("aria-hidden", "true"); }
}

/* ---------- graph interaction ---------- */
function bindNodeEvents() {
  const tree = el("tree");
  tree.querySelectorAll(".row, .gnode").forEach((b) => {
    b.addEventListener("click", () => {
      if (suppressClick) { suppressClick = false; return; }
      selectNode(b.dataset.id);
    });
  });
  tree.querySelectorAll(".gnode").forEach((g) => {
    g.addEventListener("mouseenter", () => { hover = g.dataset.id; applyFocus(); showTooltip(g.dataset.id); });
    g.addEventListener("mouseleave", () => { hover = null; applyFocus(); hideTooltip(); });
    g.addEventListener("mousemove", (ev) => positionTooltip(ev.clientX, ev.clientY));
    g.addEventListener("focus", () => {
      const r = g.getBoundingClientRect();
      hover = g.dataset.id; applyFocus();
      showTooltip(g.dataset.id, { x: r.left, y: r.bottom });
    });
    g.addEventListener("blur", () => { hover = null; applyFocus(); hideTooltip(); });
    g.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectNode(g.dataset.id); }
    });
  });
}

function zoomBy(factor, clientX, clientY) {
  if (!graphAPI || !graphAPI.svg) return;
  const v = graphAPI.vb, home = graphAPI.home;
  const rect = graphAPI.svg.getBoundingClientRect();
  const cx = clientX == null ? v.x + v.w / 2 : v.x + ((clientX - rect.left) / rect.width) * v.w;
  const cy = clientY == null ? v.y + v.h / 2 : v.y + ((clientY - rect.top) / rect.height) * v.h;
  const w = v.w * factor, h = v.h * factor;
  if (w < home.w * 0.15 || w > home.w * 12) return;
  v.x = cx - (cx - v.x) * factor;
  v.y = cy - (cy - v.y) * factor;
  v.w = w; v.h = h;
  applyViewBox();
}
function fitGraph() {
  if (!graphAPI) return;
  graphAPI.vb = { ...graphAPI.home };
  applyViewBox();
}

function bindGraphInteraction() {
  const scroll = el("graph-scroll");

  scroll.addEventListener("wheel", (ev) => {
    if (view !== "graph" || !graphAPI || !graphAPI.svg) return;
    if (!ev.target.closest("svg.graph-svg")) return;
    ev.preventDefault();
    zoomBy(Math.exp(ev.deltaY * 0.0012), ev.clientX, ev.clientY);
  }, { passive: false });

  let panning = false, moved = false, lastX = 0, lastY = 0;
  scroll.addEventListener("pointerdown", (ev) => {
    if (view !== "graph" || !graphAPI || !graphAPI.svg) return;
    if (!ev.target.closest("svg.graph-svg")) return;
    panning = true; moved = false; lastX = ev.clientX; lastY = ev.clientY;
    graphAPI.svg.classList.add("panning");
    try { scroll.setPointerCapture(ev.pointerId); } catch (e) { /* no capture, still fine */ }
  });
  scroll.addEventListener("pointermove", (ev) => {
    if (!panning || !graphAPI) return;
    const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
    if (!moved && Math.hypot(dx, dy) > 3) moved = true;
    lastX = ev.clientX; lastY = ev.clientY;
    if (!moved) return;
    const rect = graphAPI.svg.getBoundingClientRect();
    const v = graphAPI.vb;
    v.x -= dx * (v.w / rect.width);
    v.y -= dy * (v.h / rect.height);
    applyViewBox();
  });
  const endPan = (ev) => {
    if (!panning) return;
    panning = false;
    if (graphAPI && graphAPI.svg) graphAPI.svg.classList.remove("panning");
    if (moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 60); }
    try { scroll.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  };
  scroll.addEventListener("pointerup", endPan);
  scroll.addEventListener("pointercancel", endPan);
}

function setView(next) {
  view = next;
  el("view-graph").classList.toggle("active", next === "graph");
  el("view-rows").classList.toggle("active", next === "rows");
  el("view-graph").setAttribute("aria-pressed", next === "graph");
  el("view-rows").setAttribute("aria-pressed", next === "rows");
  hideTooltip();
  renderTree();
}

function selectNode(id) {
  if (selected === id) return;
  selected = id;
  selectedSig = "";
  highlight = null;
  // Re-render (a no-op when the graph structure is unchanged) so the selected
  // node's dependency edges appear and the root path lights up.
  renderTree();
  tickDetail(true);
}

/* ---------- detail ---------- */
function listOr(items, renderItem, hit) {
  if (!items || !items.length) return '<div class="empty">none</div>';
  return `<ul class="clean">${items.map((i) => {
    const isHit = hit && String(i).includes(hit);
    return `<li class="${isHit ? "hit" : ""}">${renderItem ? renderItem(i) : esc(i)}</li>`;
  }).join("")}</ul>`;
}

function eventSummary(e) {
  if (!e) return "";
  for (const k of ["error", "reason", "detail", "summary", "message", "assumption", "payload"]) {
    if (e[k] != null && e[k] !== "") return typeof e[k] === "string" ? e[k] : JSON.stringify(e[k]);
  }
  const prim = Object.entries(e)
    .filter(([k, v]) => !["at", "node", "event"].includes(k) && v != null && typeof v !== "object")
    .map(([k, v]) => k + "=" + v);
  return prim.join("  ");
}
function eventList(events) {
  if (!events || !events.length) return '<div class="empty">no events yet</div>';
  return `<div class="events">${events.map((e) => {
    const name = (e && e.event) || "event";
    const bad = name === "error" || (e && e.error) || /fail|revert|tamper|exhaust/.test(name);
    const msg = eventSummary(e);
    return `<div class="event ${bad ? "err" : ""}">
      <span class="t">${esc(when(e && e.at))}</span>
      <span class="name">${esc(name)}</span>
      <span class="msg" title="${esc(msg)}">${esc(clip(msg, 300))}</span>
    </div>`;
  }).join("")}</div>`;
}

/* Render a diff the way git prints one: file headers, @@ hunk headers, green
   additions, red removals, context lines, monospace, scrollable both ways.
   The +, - and @@ markers stay in the text so colour is never the only cue. */
function diffLineClass(line) {
  if (line.startsWith("diff --git ") || line.startsWith("diff --cc ")) return "file";
  if (line.startsWith("@@")) return "hunk";
  if (line.startsWith("+++") || line.startsWith("---")) return "head";
  if (line.startsWith("+")) return "add";
  if (line.startsWith("-")) return "del";
  if (/^(commit |Merge:|Author:|Date:|    )/.test(line)) return "commit";
  if (/^(index |new file|deleted file|similarity |rename |old mode|new mode|Binary files|GIT binary patch)/.test(line)) return "meta";
  return "ctx";
}
function renderDiff(diff) {
  if (!diff || !diff.trim()) return '<pre class="diff-box"><span class="diffline ctx">(no commit for this node)</span></pre>';
  const lines = String(diff).replace(/\n$/, "").split("\n");
  const body = lines.map((line) => `<span class="diffline ${diffLineClass(line)}">${esc(line)}</span>`).join("");
  return `<pre class="diff-box">${body}</pre>`;
}

function renderDetail(n) {
  const parent = n.parent ? byId(n.parent) : null;
  const dc = n.decisions || [];
  const criteria = n.acceptance_criteria || [];
  const verif = n.verification || [];
  const manual = n.manual_verification || [];
  const deps = n.depends_on || [];
  const constraints = n.constraints || [];
  const interfaces = n.interfaces || [];
  const artifacts = n.artifacts || [];
  const events = n.events || [];
  const errors = n.errors || [];
  const gates = n.gate_outcomes || [];

  const parentLink = parent
    ? `<a href="#" data-goto="${esc(parent.id)}" title="${esc(parent.id)}">${esc(clip(nodeName(parent), 42))}</a>`
    : "—";

  return `
    <div class="detail-head">
      <div class="meta">${stateChip(n)} <span class="row-tag">${esc(shortId(n.id))}</span></div>
      <h1>${esc(n.goal || nodeName(n))}</h1>
      <div class="meta">
        <span class="mono" title="full node id">${esc(n.id)}</span>
        <span>depth ${esc(n.depth)}</span>
        <span>parent: ${parentLink}</span>
      </div>
    </div>
    <div class="detail-body">
      ${n.summary ? `<div class="section"><h3>Summary</h3><div>${esc(n.summary)}</div></div>` : ""}

      <div class="section">
        <h3>Live activity</h3>
        <div class="nowrunning ${n.status === "running" ? "" : "idle"}" style="margin-top:0">
          <span class="label">${n.status === "running" ? "● Running" : "Last output"}</span>
          <span class="act">${esc(n.activity || "no output recorded for this node")}</span>
        </div>
      </div>

      <div class="section">
        <h3>Contract</h3>
        <h4>Goal</h4>
        <div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.goal || "")}</div>
        <h4>Acceptance criteria</h4>${listOr(criteria)}
        <h4>Verification commands <span class="muted" style="text-transform:none;letter-spacing:0">(must run on this machine)</span></h4>
        ${listOr(verif, (v) => `<span class="cmd">${esc(v)}</span>`)}
        <h4>Manual verification <span class="muted" style="text-transform:none;letter-spacing:0">(critic-judged)</span></h4>
        ${listOr(manual)}
        <h4>Depends on</h4>
        ${listOr(deps, (d) => {
          const dep = byId(d);
          return dep
            ? `<a href="#" data-goto="${esc(d)}" title="${esc(dep.goal || "")}">${esc(clip(nodeName(dep), 52))}</a> <span class="muted mono">${esc(shortId(d))}</span>`
            : `<span class="mono">${esc(d)}</span>`;
        })}
        <h4>Interfaces</h4>${listOr(interfaces)}
        <h4>Inherited constraints</h4>${listOr(constraints, null, highlight)}
      </div>

      <div class="section">
        <h3>Decisions</h3>${listOr(dc, null, highlight)}
      </div>

      <div class="section">
        <h3>Live output <span class="muted" style="text-transform:none;letter-spacing:0">(log tail)</span></h3>
        ${eventList(events)}
      </div>

      <div class="section">
        <h3>Gate outcomes</h3>
        ${gateList(gates)}
      </div>

      ${errors.length ? `<div class="section"><h3>Errors</h3>${gateList(errors)}</div>` : ""}

      <div class="section">
        <h3>Artifacts</h3>
        ${artifacts.length
          ? `<table><thead><tr><th>file</th><th style="text-align:right">size</th></tr></thead><tbody>
              ${artifacts.map((a) => `<tr><td class="mono">${esc(a.name)}</td><td class="num">${fmtBytes(a.size)}</td></tr>`).join("")}
            </tbody></table>`
          : '<div class="empty">none</div>'}
      </div>

      <div class="section">
        <h3>Committed diff</h3>
        <details class="disclosure" id="diff-disclosure">
          <summary>Show the actual changes committed for this node</summary>
          <div class="inner">${renderDiff(n.diff)}</div>
        </details>
        <details class="disclosure">
          <summary>Assembled executor context (${fmtBytes(n.context_bytes)})</summary>
          <div class="inner"><pre class="box">${esc(n.context || "")}</pre></div>
        </details>
      </div>

      ${steering(n)}
    </div>`;
}

function gateList(items) {
  if (!items || !items.length) return '<div class="empty">none</div>';
  return `<div class="events">${items.map((e) => {
    const name = (e && e.event) || "gate";
    const bad = /fail|error|revert|reject/.test(name) || (e && e.error);
    return `<div class="event ${bad ? "err" : ""}">
      <span class="t">${esc(when(e && e.at))}</span>
      <span class="name">${esc(name)}</span>
      <span class="msg">${esc(clip(eventSummary(e), 300))}</span>
    </div>`;
  }).join("")}</div>`;
}

function steering(n) {
  const allIds = (state ? state.nodes.map((x) => x.id) : []).filter((id) => id !== n.id);
  return `
    <div class="section">
      <h3>Steer this node</h3>
      <p class="hint" style="color:var(--muted);font-size:12.5px;margin:0 0 12px">
        Every action below is applied through the same state the scheduler and TUI use. Nothing changes until you confirm.
      </p>
      ${actionResult(n)}

      <div class="steer-group">
        <h4 class="group-title">Add guidance</h4>
        <p class="group-hint">Additive: pins a requirement or idea onto the work without rewriting it.</p>
        <div class="steer-grid">
          <div class="action">
            <h4>Add a constraint or idea</h4>
            <p class="hint">
              What it is: text added to this node's contract.<br />
              When: you want the work to respect something it currently does not.<br />
              Consequence: <span class="consequence">applies to this node and every descendant</span>, and is queued for a live run's next scheduler step.
            </p>
            <form id="f-constraint">
              <label for="fc-text">Constraint text</label>
              <input id="fc-text" type="text" name="text" placeholder="e.g. use the existing Store, never a parallel path" required />
              <button class="btn" type="submit">Add constraint</button>
            </form>
          </div>
        </div>
      </div>

      <div class="steer-group">
        <h4 class="group-title">Change the plan</h4>
        <p class="group-hint">Rewrites what the node must do, how it is checked, or what must finish first.</p>
        <div class="steer-grid">
          <div class="action">
            <h4>Edit the contract</h4>
            <p class="hint">
              What it is: change the goal, acceptance criteria, verification commands and manual verification.<br />
              When: the task is mis-scoped or checked the wrong way. The fields are pre-filled with the current contract.<br />
              Consequence: <span class="consequence">the node must satisfy the new contract to be accepted.</span>
            </p>
            <form id="f-edit">
              <label for="fe-goal">Goal</label>
              <textarea id="fe-goal" name="goal">${esc(n.goal || "")}</textarea>
              <label for="fe-ac">Acceptance criteria (one per line)</label>
              <textarea id="fe-ac" name="acceptance_criteria">${esc((n.acceptance_criteria || []).join("\n"))}</textarea>
              <label for="fe-v">Verification commands (one per line)</label>
              <textarea id="fe-v" name="verification" style="min-height:52px">${esc((n.verification || []).join("\n"))}</textarea>
              <label for="fe-mv">Manual verification (one per line)</label>
              <textarea id="fe-mv" name="manual_verification" style="min-height:52px">${esc((n.manual_verification || []).join("\n"))}</textarea>
              <button class="btn" type="submit">Save contract</button>
            </form>
          </div>

          <div class="action">
            <h4>Answer or route an escalation</h4>
            <p class="hint">
              What it is: amend an inherited constraint that proved false, or make this node wait for another.<br />
              When: a node escalated because an assumption does not hold on this machine.<br />
              Consequence: the amendment is written into the affected contracts; a dependency <span class="consequence">blocks this node until the named node is complete.</span>
            </p>
            <form id="f-amend">
              <label for="fa-old">Assumption that proved false</label>
              <input id="fa-old" type="text" name="old" placeholder="the assumption that proved false" required />
              <label for="fa-new">Amended constraint</label>
              <input id="fa-new" type="text" name="new" placeholder="what should be true instead" required />
              <button class="btn" type="submit">Amend constraint</button>
            </form>
            <form id="f-dep" style="margin-top:12px">
              <label for="fd-dep">Require this node to finish first</label>
              <input id="fd-dep" type="text" name="dependency" list="node-ids" placeholder="node id" required />
              <datalist id="node-ids">${allIds.map((id) => `<option value="${esc(id)}">${esc(nodeName(byId(id)))}</option>`).join("")}</datalist>
              <button class="btn ghost" type="submit">Add dependency</button>
            </form>
          </div>
        </div>
      </div>

      <div class="steer-group">
        <h4 class="group-title" style="color:var(--failed)">Destructive — removes work</h4>
        <p class="group-hint">Irreversible from the dashboard. Always confirmed before it runs.</p>
        <div class="steer-grid">
          <div class="action destructive">
            <h4>Retry this node</h4>
            <p class="hint">
              What it is: reset this node and its whole subtree back to pending.<br />
              When: a node failed or was accepted on stale assumptions and must run again.<br />
              Consequence: <span class="consequence">partial work is reverted and every descendant restarts.</span>
            </p>
            <form id="f-retry">
              <button class="btn warn" type="submit">Retry node and subtree</button>
            </form>
          </div>
        </div>
      </div>
    </div>`;
}

/* A run is live when a node is actually running. If nothing is running the
   dashboard must say so plainly, because a steering action is recorded and
   queued but only a resumed scheduler applies it. */
function isRunLive() {
  return !!(state && state.nodes.some((n) => n.status === "running"));
}
function runLivenessNote() {
  if (isRunLive()) {
    return 'A live run will pick this up on its next scheduler step.';
  }
  const root = state && state.root_status ? state.root_status : "";
  const where = root ? ` (the run is ${root})` : "";
  return `No scheduler is running right now${where}. The change is recorded in the contracts and queued, but you must resume it with "fractal run" before it takes effect.`;
}
function actionResult(node) {
  if (!lastAction || lastAction.node !== node.id) return "";
  return `<div class="result ${lastAction.ok ? "ok" : "err"}">
    <span class="head">${lastAction.ok ? "Applied" : "Rejected"} — ${esc(lastAction.message)}</span>
    ${lastAction.ok ? runLivenessNote() : ""}
  </div>`;
}

/* Inline confirmation: one prompt per action, no blocking window.confirm(),
   no duplicate dialogs. Resolves true only when Confirm is clicked. */
function inlineConfirm(f, btn, message) {
  return new Promise((resolve) => {
    if (f.dataset.armed === "1") return;
    f.dataset.armed = "1";
    const row = document.createElement("div");
    row.className = "confirm-row";
    const msg = document.createElement("span");
    msg.className = "confirm-msg";
    msg.textContent = message;
    const btns = document.createElement("div");
    btns.className = "confirm-btns";
    const go = document.createElement("button");
    go.type = "button"; go.className = "btn"; go.textContent = "Confirm";
    const cancel = document.createElement("button");
    cancel.type = "button"; cancel.className = "btn ghost"; cancel.textContent = "Cancel";
    btns.append(go, cancel);
    row.append(msg, btns);
    if (btn) btn.style.display = "none";
    f.appendChild(row);
    const cleanup = () => { f.dataset.armed = "0"; row.remove(); if (btn) btn.style.display = ""; };
    go.addEventListener("click", () => { cleanup(); resolve(true); });
    cancel.addEventListener("click", () => { cleanup(); resolve(false); });
  });
}

/* ---------- steering bindings ---------- */
function bindSteering(n) {
  const submit = (id, cfg) => {
    const f = el(id);
    if (!f) return;
    f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (f.dataset.busy === "1" || f.dataset.armed === "1") return;
      const btn = f.querySelector("button[type=submit]");
      const message = typeof cfg.confirm === "function" ? cfg.confirm(f) : cfg.confirm;
      const go = await inlineConfirm(f, btn, message);
      if (!go) return;
      f.dataset.busy = "1";
      if (btn) btn.disabled = true;
      try {
        const res = await jpost(cfg.action(f));
        if (res && res.ok) {
          lastAction = { ok: true, message: res.message || "done", node: n.id };
          highlight = cfg.highlight ? cfg.highlight(f) : null;
          if (cfg.clear) cfg.clear(f);
          toast("Applied — " + (res.message || "done"), false);
        } else {
          const err = (res && res.error) || "unknown error";
          lastAction = { ok: false, message: err, node: n.id };
          highlight = null;
          toast("Rejected — " + err, true);
        }
      } catch (err) {
        lastAction = { ok: false, message: String(err), node: n.id };
        highlight = null;
        toast("Request failed — " + err, true);
      } finally {
        f.dataset.busy = "0";
        if (btn) btn.disabled = false;
      }
      tick(true);
    });
  };

  submit("f-constraint", {
    confirm: (f) => `Add this constraint to ${n.id} and all its descendants?\n\n"${f.text.value.trim()}"`,
    action: (f) => ({ action: "constraint", node: n.id, text: f.text.value.trim() }),
    highlight: (f) => f.text.value.trim() || null,
    clear: (f) => { f.text.value = ""; },
  });
  submit("f-edit", {
    confirm: `Save these contract changes to ${n.id}?`,
    action: (f) => {
      const action = { action: "edit_contract", node: n.id };
      if (f.goal.value.trim()) action.goal = f.goal.value.trim();
      action.acceptance_criteria = lines(f.acceptance_criteria.value);
      action.verification = lines(f.verification.value);
      action.manual_verification = lines(f.manual_verification.value);
      return action;
    },
  });
  submit("f-retry", {
    confirm: `Retry ${n.id}?\n\nThis resets the node and its whole subtree to pending and reverts its partial work. It cannot be undone from the dashboard.`,
    action: () => ({ action: "retry", node: n.id }),
  });
  submit("f-amend", {
    confirm: (f) => `Amend the falsified constraint on ${n.id}?\n\n"${f.old.value.trim()}"\nbecomes\n"${f.new.value.trim()}"`,
    action: (f) => ({ action: "resolve", node: n.id, resolution: "amend", old: f.old.value.trim(), new: f.new.value.trim() }),
    highlight: (f) => f.new.value.trim() || null,
    clear: (f) => { f.old.value = ""; f.new.value = ""; },
  });
  submit("f-dep", {
    confirm: (f) => `Make ${n.id} wait for ${f.dependency.value.trim()}? It will not start until that node is complete.`,
    action: (f) => ({ action: "resolve", node: n.id, resolution: "depends_on", dependency: f.dependency.value.trim() }),
    clear: (f) => { f.dependency.value = ""; },
  });
}
function lines(v) {
  return String(v || "").split("\n").map((s) => s.trim()).filter(Boolean);
}

/* ---------- detail polling ---------- */
function formFocused() {
  const a = document.activeElement;
  return !!(a && el("detail").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function confirmOpen() {
  return !!el("detail").querySelector(".confirm-row");
}

async function tickDetail(force) {
  if (!selected || detailBusy) return;
  // Never clobber what someone is typing, and never remove an open inline
  // confirmation out from under them mid-action.
  if (!force && (formFocused() || confirmOpen())) return;
  detailBusy = true;
  try {
    const n = await jget("/api/node?id=" + encodeURIComponent(selected));
    const node = byId(selected);
    const sig = JSON.stringify([n.status, n.activity, n.depth, node && node.children, n.events && n.events.length]);
    if (force || sig !== selectedSig) {
      selectedSig = sig;
      el("detail").innerHTML = renderDetail(n);
      bindSteering(n);
    }
  } catch (err) {
    el("detail").innerHTML = `<div class="state-note err">Could not load node ${esc(selected)} — ${esc(err)}</div>`;
  } finally {
    detailBusy = false;
  }
}

/* ---------- main loop ---------- */
function setLive(status) {
  const live = el("live");
  live.className = "live " + (status === "ok" ? "busy" : status === "off" ? "off" : "");
  el("liveText").textContent =
    status === "ok" ? "live" : status === "off" ? "disconnected" : "connecting…";
}

async function tick(force) {
  try {
    state = await jget("/api/state");
    setLive("ok");
    el("project").textContent = state.project || "";
    el("project").title = state.project || "";
    renderOverview();
    renderTree();
    if (!selected && state.nodes.length) {
      const root = byId("root") || state.nodes[0];
      selected = root.id;
      renderTree();
    }
    await tickDetail(force);
  } catch (err) {
    setLive("off");
    if (!state) {
      el("overview").innerHTML = `<div class="state-note err">Dashboard disconnected — ${esc(err)}. Retrying…</div>`;
      el("tree").innerHTML = '<div class="state-note err">No state available.</div>';
    }
  }
}

document.addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-goto]");
  if (a) { ev.preventDefault(); selectNode(a.dataset.goto); }
});
el("view-graph").addEventListener("click", () => setView("graph"));
el("view-rows").addEventListener("click", () => setView("rows"));
el("show-deps").addEventListener("change", (ev) => {
  showDeps = ev.target.checked;
  applyFocus();
});
el("zoom-in").addEventListener("click", () => zoomBy(0.8));
el("zoom-out").addEventListener("click", () => zoomBy(1.25));
el("zoom-fit").addEventListener("click", fitGraph);
bindGraphInteraction();

/* A narrow phone gets the flat Rows view by default: the graph still works and
   is one tap away, but a wide graph must not be the first thing on a 390px
   screen. The choice is the viewer's after that. */
if (window.innerWidth < 640) setView("rows");

setInterval(tick, 2000);
tick(true);
</script>
</body>
