<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fractal dashboard</title>
<style>
  :root {
    --bg: #0f1118;
    --bg-soft: #151824;
    --panel: #191d2b;
    --panel-2: #202637;
    --line: #2c3348;
    --line-soft: #232a3d;
    --text: #eef1f8;
    --muted: #9aa3bd;
    --faint: #6b7593;
    --accent: #8aa9ff;
    --accent-ink: #0f1320;
    --complete: #5fd08a;
    --running: #f0c25c;
    --split: #8aa9ff;
    --failed: #ff7b7b;
    --suspended: #c9a6f0;
    --pending: #8b94b0;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(138,169,255,.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, .mono { font-family: var(--mono); }

  /* ---------- app bar ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px;
    background: rgba(15,17,24,.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .02em; font-size: 15px; }
  .brand .spark { color: var(--accent); }
  .project {
    color: var(--muted); font-family: var(--mono); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 46vw; min-width: 0;
  }
  .appbar .spacer { flex: 1; }
  .live {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .live .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--complete); box-shadow: 0 0 0 0 rgba(95,208,138,.5);
  }
  .live.busy .pulse { background: var(--running); animation: pulse 1.4s infinite; }
  .live.off .pulse { background: var(--failed); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(240,194,92,.55); }
    70% { box-shadow: 0 0 0 7px rgba(240,194,92,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,194,92,0); }
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 18px; }

  /* ---------- overview ---------- */
  .overview {
    background: linear-gradient(180deg, var(--panel), var(--bg-soft));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .overview-top { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .overview-goal { flex: 1 1 340px; min-width: 0; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: .1em; font-size: 11px;
    color: var(--faint); font-weight: 600; margin-bottom: 6px;
  }
  .goal-title {
    font-size: clamp(18px, 2.4vw, 25px); line-height: 1.25; font-weight: 650;
    margin: 0; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .goal-sub { margin-top: 8px; color: var(--muted); font-size: 13px; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat {
    min-width: 76px; flex: 1 1 auto;
    background: var(--panel-2); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 8px 12px;
  }
  .stat .n { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .stat.is-complete .n { color: var(--complete); }
  .stat.is-running .n { color: var(--running); }
  .stat.is-failed .n { color: var(--failed); }
  .stat.is-pending .n { color: var(--pending); }
  .stat.is-refused .n { color: var(--failed); }
  .stat.is-split .n { color: var(--split); }

  .progress { margin-top: 16px; }
  .progress-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 9px; border-radius: 999px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line-soft); }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, #5fd08a, #8aa9ff); width: 0; transition: width .5s ease; }

  .nowrunning {
    margin-top: 16px; padding: 12px 14px;
    background: rgba(240,194,92,.07);
    border: 1px solid rgba(240,194,92,.3);
    border-radius: 10px;
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  .nowrunning.idle { background: var(--panel-2); border-color: var(--line-soft); }
  .nowrunning .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--running); font-weight: 700; }
  .nowrunning.idle .label { color: var(--faint); }
  .nowrunning .who { font-weight: 600; overflow-wrap: anywhere; }
  .nowrunning .act {
    font-family: var(--mono); font-size: 12.5px; color: var(--muted);
    overflow-wrap: anywhere; min-width: 0; flex: 1 1 260px;
  }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: minmax(360px, 560px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .layout > * { min-width: 0; }

  /* ---------- tree ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--line-soft);
  }
  .panel-head h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
  .tree { padding: 8px; max-height: calc(100vh - 300px); overflow: auto; }
  .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree li { position: relative; }
  .tree li > ul { margin-left: 14px; padding-left: 12px; border-left: 1px solid var(--line-soft); }

  /* ---------- animated graph ---------- */
  .viewtoggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .viewtoggle button {
    background: transparent; color: var(--muted); border: 0; padding: 4px 11px;
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .viewtoggle button.active { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 16px;
    padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
    font-size: 11.5px; color: var(--muted);
  }
  .legend .item { display: inline-flex; align-items: center; gap: 7px; }
  .legend .swatch { width: 22px; height: 0; border-top: 2px solid var(--line); }
  .legend .swatch.parent { border-color: var(--line); }
  .legend .swatch.dep { border-color: var(--suspended); border-top-style: dashed; }
  .legend .swatch.active { border-color: var(--running); border-top-style: dashed; }
  .legend .swatch.complete { border-color: var(--complete); }
  .legend .swatch.failed { border-color: var(--failed); }
  .legend .swatch.pending { border-color: var(--pending); border-top-style: dashed; opacity: .6; }

  .graph-scroll { overflow: auto; max-height: calc(100vh - 250px); overscroll-behavior: contain; }
  .graph { position: relative; }
  .graph svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .edge { fill: none; stroke-width: 1.6; }
  .edge-parent { stroke: var(--line); }
  .edge-parent.edge-pending { stroke: var(--pending); opacity: .5; stroke-dasharray: 4 5; }
  .edge-parent.edge-complete { stroke: var(--complete); opacity: .85; }
  .edge-parent.edge-active { stroke: var(--running); stroke-width: 2.4; stroke-dasharray: 7 6; animation: dash 1s linear infinite; }
  .edge-parent.edge-failed { stroke: var(--failed); stroke-width: 2.1; }
  .edge-dep { stroke: var(--suspended); stroke-width: 1.4; stroke-dasharray: 3 5; opacity: .72; }
  .edge-dep.edge-active { stroke: var(--running); opacity: 1; stroke-width: 1.9; stroke-dasharray: 5 5; animation: dash 1.1s linear infinite; }
  .edge-dep.edge-failed { stroke: var(--failed); opacity: .9; }
  .edge-dep.edge-complete { stroke: var(--complete); opacity: .55; }
  @keyframes dash { to { stroke-dashoffset: -26; } }

  .gnode {
    position: absolute; z-index: 2;
    display: flex; flex-direction: column; gap: 5px; text-align: left;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; color: var(--text); font: inherit; cursor: pointer;
    overflow: hidden;
  }
  .gnode:hover { border-color: var(--accent); }
  .gnode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .gnode.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(138,169,255,.35); }
  .gnode.running { border-color: rgba(240,194,92,.65); }
  .gnode.running::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--running), transparent);
    background-size: 200% 100%; animation: flow 1.6s linear infinite;
  }
  @keyframes flow { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .gnode .top { display: flex; align-items: center; gap: 6px; }
  .gnode .gt {
    font-size: 12.5px; font-weight: 560; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: anywhere;
  }
  .gnode .ga {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gnode .ga:empty { display: none; }
  .gnode .top .row-tag { margin-left: auto; }

  .row {
    width: 100%; text-align: left; cursor: pointer;
    display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center;
    gap: 8px 10px;
    padding: 8px 10px; margin: 2px 0;
    background: transparent; border: 1px solid transparent; border-radius: 10px;
    color: var(--text); font: inherit;
  }
  .row:hover { background: var(--panel-2); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row.selected { background: rgba(138,169,255,.12); border-color: rgba(138,169,255,.4); }
  .row .doto { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .row.running .doto { animation: pulse 1.4s infinite; }
  .row-main { min-width: 0; }
  .row-title {
    font-size: 14px; font-weight: 550; line-height: 1.3;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow-wrap: anywhere;
  }
  .row-activity {
    margin-top: 3px; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-activity:empty { display: none; }
  .row-tag {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    background: var(--bg-soft); border: 1px solid var(--line-soft);
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }

  /* ---------- status chips ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap;
    border: 1px solid currentColor; color: var(--pending);
  }
  .chip .doto { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: none; }
  .chip.complete { color: var(--complete); }
  .chip.running { color: var(--running); }
  .chip.running .doto { animation: pulse 1.4s infinite; }
  .chip.split { color: var(--split); }
  .chip.failed { color: var(--failed); }
  .chip.suspended { color: var(--suspended); }
  .chip.pending { color: var(--pending); }

  .badge {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 7px; margin-left: 6px;
  }
  .badge.warn { color: var(--running); border-color: rgba(240,194,92,.4); }
  .badge.bad { color: var(--failed); border-color: rgba(255,123,123,.4); }

  /* ---------- detail ---------- */
  .detail { min-width: 0; }
  .detail-head { padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
  .detail-head h1 { margin: 10px 0 6px; font-size: clamp(17px, 2vw, 22px); line-height: 1.3; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .meta .mono { font-size: 12px; overflow-wrap: anywhere; }
  .detail-body { padding: 4px 18px 22px; }
  .section { padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
  .section:last-child { border-bottom: 0; }
  .section h3 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--accent); font-weight: 700;
  }
  .section h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .section h4:first-child { margin-top: 0; }
  ul.clean { margin: 0 0 8px; padding-left: 18px; }
  ul.clean li { margin: 3px 0; overflow-wrap: anywhere; }
  .empty { color: var(--faint); font-style: italic; font-size: 13px; }
  pre.box {
    margin: 6px 0 0; padding: 12px; background: var(--bg-soft);
    border: 1px solid var(--line-soft); border-radius: 10px;
    overflow: auto; max-height: 380px; font-size: 12.5px; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .cmd { font-family: var(--mono); font-size: 12.5px; background: var(--bg-soft); border: 1px solid var(--line-soft); border-radius: 6px; padding: 1px 6px; }

  .events { display: flex; flex-direction: column; gap: 2px; }
  .event {
    display: grid; grid-template-columns: auto auto minmax(0,1fr); gap: 10px;
    align-items: baseline; padding: 5px 8px; border-radius: 8px; font-size: 12.5px;
  }
  .event:nth-child(odd) { background: var(--bg-soft); }
  .event .t { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .event .name {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    text-transform: none; white-space: nowrap;
  }
  .event.err .name { color: var(--failed); }
  .event .msg { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
  .event.err .msg { color: #ffb4b4; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  td.num { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }

  details.disclosure { margin: 8px 0 0; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg-soft); }
  details.disclosure > summary {
    cursor: pointer; padding: 9px 12px; font-size: 12.5px; color: var(--muted);
    list-style: none; user-select: none;
  }
  details.disclosure > summary::-webkit-details-marker { display: none; }
  details.disclosure > summary::before { content: "▸ "; color: var(--faint); }
  details.disclosure[open] > summary::before { content: "▾ "; }
  details.disclosure .inner { padding: 0 12px 12px; }

  /* ---------- steering ---------- */
  .steer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .action {
    background: var(--bg-soft); border: 1px solid var(--line-soft);
    border-radius: 12px; padding: 14px;
  }
  .action h4 { margin: 0 0 2px; font-size: 13.5px; color: var(--text); font-weight: 650; text-transform: none; letter-spacing: 0; }
  .action p.hint { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  form { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 12px; color: var(--muted); }
  input[type=text], textarea, select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: 13.5px;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  textarea { min-height: 68px; resize: vertical; }
  .btn {
    align-self: flex-start; cursor: pointer; border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-weight: 650; font-size: 13px;
    background: var(--accent); color: var(--accent-ink);
    transition: filter .12s ease, transform .06s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.warn { background: var(--running); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }

  /* ---------- toast / states ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 50; max-width: min(92vw, 620px);
    padding: 11px 16px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--line);
    box-shadow: var(--shadow); font-size: 13.5px;
    display: none;
  }
  .toast.show { display: block; }
  .toast.err { border-color: rgba(255,123,123,.5); color: #ffb4b4; }
  .toast.ok { border-color: rgba(95,208,138,.5); }

  .state-note {
    margin: 8px; padding: 14px; border-radius: 10px; text-align: center;
    color: var(--muted); font-size: 13.5px; border: 1px dashed var(--line);
  }
  .state-note.err { color: #ffb4b4; border-color: rgba(255,123,123,.4); }
  .skeleton { border-radius: 8px; background: linear-gradient(90deg, var(--panel-2), var(--line-soft), var(--panel-2)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ---------- responsive ---------- */
  @media (max-width: 900px) {
    .wrap { padding: 12px; }
    .layout { grid-template-columns: 1fr; }
    .tree { max-height: 46vh; }
    .project { max-width: 100%; }
    .overview { padding: 15px; }
    .stats { width: 100%; }
    .stat { min-width: calc(50% - 4px); }
  }
  @media (max-width: 430px) {
    body { font-size: 14px; }
    .stat { min-width: calc(50% - 4px); padding: 7px 9px; }
    .stat .n { font-size: 19px; }
    .appbar { padding: 9px 12px; gap: 8px; }
    .detail-head, .detail-body { padding-left: 13px; padding-right: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header class="appbar">
    <span class="brand"><span class="spark">◆</span> fractal</span>
    <span class="project" id="project" title=""></span>
    <span class="spacer"></span>
    <span class="live off" id="live"><span class="pulse"></span><span id="liveText">connecting…</span></span>
  </header>

  <div class="wrap">
    <section class="overview" id="overview">
      <div class="state-note">Loading run state…</div>
    </section>
    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>Task graph</h2>
          <div class="viewtoggle" role="group" aria-label="Tree view">
            <button type="button" id="view-graph" class="active" aria-pressed="true">Graph</button>
            <button type="button" id="view-rows" aria-pressed="false">Rows</button>
          </div>
          <span class="muted" id="treeCount"></span>
        </div>
        <div class="legend" id="legend">
          <span class="item"><span class="swatch parent"></span>parent → child</span>
          <span class="item"><span class="swatch dep"></span>depends on</span>
          <span class="item"><span class="swatch active"></span>active path</span>
          <span class="item"><span class="swatch complete"></span>done</span>
          <span class="item"><span class="swatch failed"></span>failed</span>
          <span class="item"><span class="swatch pending"></span>waiting</span>
        </div>
        <div class="graph-scroll" id="graph-scroll">
          <div class="graph" id="tree"><div class="state-note">Waiting for nodes…</div></div>
        </div>
      </section>
      <section class="panel detail" id="detail">
        <div class="state-note">Select a node to see its contract, activity and controls.</div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const el = (id) => document.getElementById(id);
const STATUS_ORDER = ["complete", "running", "failed", "split", "suspended", "pending"];

let state = null;
let selected = null;
let selectedSig = "";
let detailBusy = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function firstLine(s) {
  return String(s || "").split("\n").map((x) => x.trim()).find(Boolean) || "";
}
function clip(s, n) {
  s = String(s || "");
  return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
}
function shortId(id) {
  if (id === "root") return "root";
  const parts = String(id).split("-");
  const last = parts[parts.length - 1];
  return /^\d+$/.test(last) ? last : clip(id, 7);
}
function nodeName(n) {
  return firstLine(n && n.goal) || (n && n.id === "root" ? "Project goal" : (n && n.id) || "node");
}
function statusLabel(s) {
  return String(s || "pending").replace(/_/g, " ");
}
function chip(status, withDot) {
  const s = status || "pending";
  return `<span class="chip ${esc(s)}">${withDot === false ? "" : '<span class="doto"></span>'}${esc(statusLabel(s))}</span>`;
}
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(11, 19);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

const byId = (id) => (state && state.nodes.find((n) => n.id === id)) || null;
const childrenOf = (id) =>
  (state ? state.nodes.filter((n) => (n.parent || null) === (id || null)) : []);

/* ---------- data ---------- */
async function jget(url) {
  const r = await fetch(url, { headers: { Accept: "application/json" } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.error) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
async function jpost(action) {
  const r = await fetch("/api/action", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(action),
  });
  return r.json().catch(() => ({ ok: false, error: "HTTP " + r.status }));
}

let toastTimer = null;
function toast(msg, isErr) {
  const box = el("toast");
  box.textContent = msg;
  box.className = "toast show " + (isErr ? "err" : "ok");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.className = "toast"; }, 5000);
}

/* ---------- overview ---------- */
function renderOverview() {
  const c = (state && state.counts) || {};
  const total = c.total || (state ? state.nodes.length : 0) || 0;
  const complete = c.complete || 0;
  const refused = (state && state.trace && state.trace.refused) || 0;
  const overall = (state && state.overall_status) || (state && state.root_status) || "pending";
  const rootGoal = (state && (state.root_goal || (byId("root") || {}).goal)) || "this project";
  const pct = total ? Math.round((complete / total) * 100) : 0;

  const running = state ? state.nodes.filter((n) => n.status === "running") : [];
  const lead = running[0] || null;
  const now = lead
    ? `<div class="nowrunning">
         <span class="label">● Now running</span>
         <span class="who">${esc(nodeName(lead))}</span>
         <span class="act" title="${esc(lead.activity || "")}">${esc(lead.activity || "starting…")}</span>
       </div>`
    : `<div class="nowrunning idle">
         <span class="label">Run</span>
         <span class="act">${state && state.nodes.some((n) => n.status === "failed")
            ? "Stopped with failures. Select a failed node to retry it or steer the tree below."
            : "No node is running right now."}</span>
       </div>`;

  el("overview").innerHTML = `
    <div class="overview-top">
      <div class="overview-goal">
        <div class="eyebrow">Overall goal</div>
        <h1 class="goal-title" title="${esc(rootGoal)}">${esc(rootGoal)}</h1>
        <div class="goal-sub">${esc(state ? state.project : "")}</div>
      </div>
      <div class="stats">
        ${stat("complete", complete, "complete")}
        ${stat("running", c.running || 0, "running")}
        ${stat("pending", c.pending || 0, "pending")}
        ${stat("failed", c.failed || 0, "failed")}
        ${stat("split", c.split || 0, "split")}
        ${stat("refused", refused, "refused")}
      </div>
    </div>
    <div class="progress">
      <div class="progress-head">
        <span><strong style="color:var(--text)">${complete}</strong> of ${total} nodes complete</span>
        <span>${chip(overall)}</span>
      </div>
      <div class="bar"><span style="width:${pct}%"></span></div>
    </div>
    ${now}`;
}
function stat(kind, n, label) {
  return `<div class="stat is-${kind}"><div class="n">${n}</div><div class="k">${label}</div></div>`;
}

/* ---------- task graph ---------- */
let view = "graph";

function renderTree() {
  el("treeCount").textContent = state ? state.nodes.length + (state.nodes.length === 1 ? " node" : " nodes") : "";
  if (!state || !state.nodes.length) {
    el("tree").innerHTML = '<div class="state-note">No nodes yet. This project has not been initialised.</div>';
    return;
  }
  const scroll = el("graph-scroll");
  const keepLeft = scroll.scrollLeft, keepTop = scroll.scrollTop;
  if (view === "rows") renderRows();
  else renderGraph();
  el("tree").querySelectorAll(".row, .gnode").forEach((b) => {
    b.addEventListener("click", () => selectNode(b.dataset.id));
  });
  scroll.scrollLeft = keepLeft;
  scroll.scrollTop = keepTop;
}

function renderRows() {
  const build = (nodes) => {
    if (!nodes.length) return "";
    return `<ul>${nodes.map((n) => {
      const kids = childrenOf(n.id);
      const badges =
        (n.stale ? ' <span class="badge warn">stale</span>' : "") +
        (n.tampered ? ' <span class="badge bad">tampered</span>' : "");
      const activity = n.activity
        ? `<div class="row-activity" title="${esc(n.activity)}">${esc(clip(n.activity, 120))}</div>`
        : "";
      return `<li>
        <button class="row ${n.status === "running" ? "running" : ""} ${selected === n.id ? "selected" : ""}"
                data-id="${esc(n.id)}" title="${esc(n.id)}\n${esc(n.goal || "")}">
          <span class="doto" style="background:var(--${esc(n.status)},var(--pending))"></span>
          <span class="row-main">
            <span class="row-title">${esc(nodeName(n))}</span>
            ${activity}
          </span>
          <span style="display:flex;align-items:center;gap:6px;flex:none">${chip(n.status)}<span class="row-tag">${esc(shortId(n.id))}</span></span>
        </button>
        ${build(kids)}
      </li>`;
    }).join("")}</ul>`;
  };
  const root = byId("root");
  const top = root ? [root] : state.nodes.filter((n) => !n.parent);
  el("tree").innerHTML = build(top) || '<div class="state-note">No nodes.</div>';
}

/* Edge state rules:
   - a parent edge carries the child's status;
   - a dependency edge is failed if the node it feeds failed, active while the
     dependent (or the dependency itself) is running, complete once the
     dependency is done, and waiting otherwise. Every state is also named in
     the legend, so colour is never the only carrier. */
function edgeState(status) {
  if (status === "failed") return "failed";
  if (status === "running") return "active";
  if (status === "complete") return "complete";
  return "pending";
}
function depEdgeState(dep, node) {
  if (node.status === "failed" || dep.status === "failed") return "failed";
  if (node.status === "running" || dep.status === "running") return "active";
  if (dep.status === "complete") return "complete";
  return "pending";
}

function renderGraph() {
  const scroll = el("graph-scroll");
  const avail = (scroll.clientWidth || 800) - 4;
  const compact = avail < 640;
  const W = compact ? 198 : 246;
  const H = compact ? 80 : 88;
  const colGap = compact ? 56 : 86;
  const rowGap = 16;
  const pad = 18;

  const order = [];
  const visit = (n) => { order.push(n); childrenOf(n.id).forEach(visit); };
  const root = byId("root");
  (root ? [root] : state.nodes.filter((n) => !n.parent)).forEach(visit);

  const pos = {};
  order.forEach((n, i) => {
    const col = Math.max(0, (Number(n.depth) || 1) - 1);
    pos[n.id] = { x: pad + col * (W + colGap), y: pad + i * (H + rowGap) };
  });

  const parentCurve = (a, b) => {
    const dx = Math.max(26, (b.x - a.x) / 2);
    return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
  };
  // Dependency edges bow out to the RIGHT of the cards, so they never run
  // through the cards or over a parent edge (which always enters from the left).
  // Each successive dependency on the same node stacks a little further out.
  const depCurve = (a, b, k) => {
    const bx = Math.max(a.x, b.x) + W + 26 + k * 11;
    return `M${a.x + W},${a.y + H / 2} C${bx},${a.y + H / 2} ${bx},${b.y + H / 2} ${b.x + W},${b.y + H / 2}`;
  };

  const edges = [];
  // The active path is the running node plus every ancestor above it, so the
  // whole route from the root to the work in progress lights up, not just the
  // last hop. Failed beats active beats complete beats waiting.
  const activeIds = new Set();
  for (const n of order) {
    if (n.status !== "running") continue;
    for (let cur = n; cur; cur = cur.parent ? byId(cur.parent) : null) activeIds.add(cur.id);
  }
  const pathState = (n) => (n.status === "failed" ? "failed" : activeIds.has(n.id) ? "active" : edgeState(n.status));

  let maxRight = 0;
  for (const n of order) {
    if (n.parent && pos[n.parent]) {
      const a = pos[n.parent], b = pos[n.id];
      edges.push(`<path class="edge edge-parent edge-${pathState(n)}" d="${parentCurve(
        { x: a.x + W, y: a.y + H / 2 }, { x: b.x, y: b.y + H / 2 })}" />`);
    }
  }
  for (const n of order) {
    const deps = (n.depends_on || []).map((d) => byId(d)).filter((d) => d && pos[d.id]);
    deps.forEach((dep, k) => {
      const a = pos[dep.id], b = pos[n.id];
      const bx = Math.max(a.x, b.x) + W + 26 + k * 11;
      maxRight = Math.max(maxRight, bx + 12);
      const state = dep.status === "failed" || n.status === "failed"
        ? "failed"
        : activeIds.has(n.id) || dep.status === "running"
          ? "active"
          : depEdgeState(dep, n);
      edges.push(`<path class="edge edge-dep edge-${state}" marker-end="url(#arrow)" d="${depCurve(a, b, k)}" />`);
    });
  }

  const cards = order.map((n) => {
    const p = pos[n.id];
    const activity = n.activity || "";
    const badges =
      (n.stale ? ' <span class="badge warn">stale</span>' : "") +
      (n.tampered ? ' <span class="badge bad">tampered</span>' : "");
    return `<button class="gnode ${n.status === "running" ? "running" : ""} ${selected === n.id ? "selected" : ""}"
      data-id="${esc(n.id)}" style="left:${p.x}px;top:${p.y}px;width:${W}px;height:${H}px"
      title="${esc(n.id)}\n${esc(n.goal || "")}">
      <span class="top">${chip(n.status)}<span class="row-tag">${esc(shortId(n.id))}</span></span>
      <span class="gt">${esc(nodeName(n))}${badges}</span>
      <span class="ga" title="${esc(activity)}">${esc(activity ? "▸ " + activity : "")}</span>
    </button>`;
  }).join("");

  const width = Math.max(avail, ...order.map((n) => pos[n.id].x + W), maxRight) + pad;
  const height = Math.max(240, pad + order.length * (H + rowGap));

  el("tree").innerHTML =
    `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true">
       <defs>
         <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
           <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" />
         </marker>
       </defs>
       <g class="edges">${edges.join("")}</g>
     </svg>
     <div class="gnodes">${cards}</div>`;
  el("tree").style.width = width + "px";
  el("tree").style.height = height + "px";
}

function setView(next) {
  view = next;
  el("view-graph").classList.toggle("active", next === "graph");
  el("view-rows").classList.toggle("active", next === "rows");
  el("view-graph").setAttribute("aria-pressed", next === "graph");
  el("view-rows").setAttribute("aria-pressed", next === "rows");
  el("graph-scroll").style.maxHeight = next === "graph" ? "" : "calc(100vh - 250px)";
  renderTree();
}


function selectNode(id) {
  if (selected === id) return;
  selected = id;
  selectedSig = "";
  el("tree").querySelectorAll(".row, .gnode").forEach((b) =>
    b.classList.toggle("selected", b.dataset.id === id));
  tickDetail(true);
}

/* ---------- detail ---------- */
function listOr(items, renderItem) {
  if (!items || !items.length) return '<div class="empty">none</div>';
  return `<ul class="clean">${items.map((i) => `<li>${renderItem ? renderItem(i) : esc(i)}</li>`).join("")}</ul>`;
}

function eventSummary(e) {
  if (!e) return "";
  for (const k of ["error", "reason", "detail", "summary", "message", "assumption", "payload"]) {
    if (e[k] != null && e[k] !== "") return typeof e[k] === "string" ? e[k] : JSON.stringify(e[k]);
  }
  const prim = Object.entries(e)
    .filter(([k, v]) => !["at", "node", "event"].includes(k) && v != null && typeof v !== "object")
    .map(([k, v]) => k + "=" + v);
  return prim.join("  ");
}
function eventList(events) {
  if (!events || !events.length) return '<div class="empty">no events yet</div>';
  return `<div class="events">${events.map((e) => {
    const name = (e && e.event) || "event";
    const bad = name === "error" || (e && e.error) || /fail|revert|tamper|exhaust/.test(name);
    const msg = eventSummary(e);
    return `<div class="event ${bad ? "err" : ""}">
      <span class="t">${esc(when(e && e.at))}</span>
      <span class="name">${esc(name)}</span>
      <span class="msg" title="${esc(msg)}">${esc(clip(msg, 300))}</span>
    </div>`;
  }).join("")}</div>`;
}

function renderDetail(n) {
  const parent = n.parent ? byId(n.parent) : null;
  const dc = n.decisions || [];
  const criteria = n.acceptance_criteria || [];
  const verif = n.verification || [];
  const manual = n.manual_verification || [];
  const deps = n.depends_on || [];
  const constraints = n.constraints || [];
  const interfaces = n.interfaces || [];
  const artifacts = n.artifacts || [];
  const events = n.events || [];
  const errors = n.errors || [];
  const gates = n.gate_outcomes || [];

  const parentLink = parent
    ? `<a href="#" data-goto="${esc(parent.id)}" title="${esc(parent.id)}">${esc(clip(nodeName(parent), 42))}</a>`
    : "—";

  return `
    <div class="detail-head">
      <div class="meta">${chip(n.status)} <span class="row-tag">${esc(shortId(n.id))}</span></div>
      <h1>${esc(n.goal || nodeName(n))}</h1>
      <div class="meta">
        <span class="mono" title="full node id">${esc(n.id)}</span>
        <span>depth ${esc(n.depth)}</span>
        <span>parent: ${parentLink}</span>
      </div>
    </div>
    <div class="detail-body">
      ${n.summary ? `<div class="section"><h3>Summary</h3><div>${esc(n.summary)}</div></div>` : ""}

      <div class="section">
        <h3>Live activity</h3>
        <div class="nowrunning ${n.status === "running" ? "" : "idle"}" style="margin-top:0">
          <span class="label">${n.status === "running" ? "● Running" : "Last output"}</span>
          <span class="act">${esc(n.activity || "no output recorded for this node")}</span>
        </div>
      </div>

      <div class="section">
        <h3>Contract</h3>
        <h4>Goal</h4>
        <div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.goal || "")}</div>
        <h4>Acceptance criteria</h4>${listOr(criteria)}
        <h4>Verification commands <span class="muted" style="text-transform:none;letter-spacing:0">(must run on this machine)</span></h4>
        ${listOr(verif, (v) => `<span class="cmd">${esc(v)}</span>`)}
        <h4>Manual verification <span class="muted" style="text-transform:none;letter-spacing:0">(critic-judged)</span></h4>
        ${listOr(manual)}
        <h4>Depends on</h4>
        ${listOr(deps, (d) => {
          const dep = byId(d);
          return dep
            ? `<a href="#" data-goto="${esc(d)}" title="${esc(dep.goal || "")}">${esc(clip(nodeName(dep), 52))}</a> <span class="muted mono">${esc(shortId(d))}</span>`
            : `<span class="mono">${esc(d)}</span>`;
        })}
        <h4>Interfaces</h4>${listOr(interfaces)}
        <h4>Inherited constraints</h4>${listOr(constraints)}
      </div>

      <div class="section">
        <h3>Decisions</h3>${listOr(dc)}
      </div>

      <div class="section">
        <h3>Live output <span class="muted" style="text-transform:none;letter-spacing:0">(log tail)</span></h3>
        ${eventList(events)}
      </div>

      <div class="section">
        <h3>Gate outcomes</h3>
        ${gateList(gates)}
      </div>

      ${errors.length ? `<div class="section"><h3>Errors</h3>${gateList(errors)}</div>` : ""}

      <div class="section">
        <h3>Artifacts</h3>
        ${artifacts.length
          ? `<table><thead><tr><th>file</th><th style="text-align:right">size</th></tr></thead><tbody>
              ${artifacts.map((a) => `<tr><td class="mono">${esc(a.name)}</td><td class="num">${fmtBytes(a.size)}</td></tr>`).join("")}
            </tbody></table>`
          : '<div class="empty">none</div>'}
      </div>

      <div class="section">
        <h3>Committed diff</h3>
        <details class="disclosure">
          <summary>Show the actual changes committed for this node</summary>
          <div class="inner"><pre class="box">${esc(n.diff || "(no commit for this node)")}</pre></div>
        </details>
        <details class="disclosure">
          <summary>Assembled executor context (${fmtBytes(n.context_bytes)})</summary>
          <div class="inner"><pre class="box">${esc(n.context || "")}</pre></div>
        </details>
      </div>

      ${steering(n)}
    </div>`;
}

function gateList(items) {
  if (!items || !items.length) return '<div class="empty">none</div>';
  return `<div class="events">${items.map((e) => {
    const name = (e && e.event) || "gate";
    const bad = /fail|error|revert|reject/.test(name) || (e && e.error);
    return `<div class="event ${bad ? "err" : ""}">
      <span class="t">${esc(when(e && e.at))}</span>
      <span class="name">${esc(name)}</span>
      <span class="msg">${esc(clip(eventSummary(e), 300))}</span>
    </div>`;
  }).join("")}</div>`;
}

function steering(n) {
  const allIds = (state ? state.nodes.map((x) => x.id) : []).filter((id) => id !== n.id);
  return `
    <div class="section">
      <h3>Steer this node</h3>
      <p class="hint" style="color:var(--muted);font-size:12.5px;margin:0 0 12px">
        Every action below is applied through the same state the scheduler and TUI use. Nothing changes until you press the button.
      </p>
      <div class="steer-grid">
        <div class="action">
          <h4>Add a constraint or idea</h4>
          <p class="hint">Applies to this node and every descendant, and reaches a live scheduler on its next step.</p>
          <form id="f-constraint">
            <label for="fc-text">Constraint text</label>
            <input id="fc-text" type="text" name="text" placeholder="e.g. use the existing Store, never a parallel path" required />
            <button class="btn" type="submit">Add constraint</button>
          </form>
        </div>

        <div class="action">
          <h4>Edit the contract</h4>
          <p class="hint">Change what this node is required to do and how it is checked.</p>
          <form id="f-edit">
            <label for="fe-goal">Goal</label>
            <textarea id="fe-goal" name="goal" placeholder="${esc(n.goal)}"></textarea>
            <label for="fe-ac">Acceptance criteria (one per line)</label>
            <textarea id="fe-ac" name="acceptance_criteria">${esc((n.acceptance_criteria || []).join("\n"))}</textarea>
            <label for="fe-v">Verification commands (one per line)</label>
            <textarea id="fe-v" name="verification" style="min-height:52px">${esc((n.verification || []).join("\n"))}</textarea>
            <label for="fe-mv">Manual verification (one per line)</label>
            <textarea id="fe-mv" name="manual_verification" style="min-height:52px">${esc((n.manual_verification || []).join("\n"))}</textarea>
            <button class="btn" type="submit">Save contract</button>
          </form>
        </div>

        <div class="action">
          <h4>Retry this node</h4>
          <p class="hint">Resets this node and its subtree to pending. A failed node's partial work is reverted first.</p>
          <form id="f-retry">
            <button class="btn warn" type="submit">Retry node and subtree</button>
          </form>
        </div>

        <div class="action">
          <h4>Answer or route an escalation</h4>
          <p class="hint">Amend a falsified inherited constraint, or require another node to finish first.</p>
          <form id="f-amend">
            <label for="fa-old">Assumption that proved false</label>
            <input id="fa-old" type="text" name="old" placeholder="the assumption that proved false" required />
            <label for="fa-new">Amended constraint</label>
            <input id="fa-new" type="text" name="new" placeholder="what should be true instead" required />
            <button class="btn" type="submit">Amend constraint</button>
          </form>
          <form id="f-dep" style="margin-top:12px">
            <label for="fd-dep">Require this node to finish first</label>
            <input id="fd-dep" type="text" name="dependency" list="node-ids" placeholder="node id" required />
            <datalist id="node-ids">${allIds.map((id) => `<option value="${esc(id)}">${esc(nodeName(byId(id)))}</option>`).join("")}</datalist>
            <button class="btn ghost" type="submit">Add dependency</button>
          </form>
        </div>
      </div>
    </div>`;
}

/* ---------- steering bindings ---------- */
function bindSteering(n) {
  const done = (res) => {
    if (!res) return;
    if (res.ok) toast("Done — " + res.message, false);
    else toast("Rejected — " + (res.error || "unknown error"), true);
    tick(true);
  };
  const submit = (id, handler) => {
    const f = el(id);
    if (!f) return;
    f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = f.querySelector("button[type=submit]");
      if (btn) btn.disabled = true;
      try { done(await handler(f)); }
      catch (err) { toast("Request failed — " + err, true); }
      finally { if (btn) btn.disabled = false; }
    });
  };

  submit("f-constraint", (f) => {
    const text = f.text.value.trim();
    if (!text) return null;
    if (!confirm(`Add this constraint to ${n.id} and all its descendants?\n\n"${text}"`)) return null;
    return jpost({ action: "constraint", node: n.id, text });
  });
  submit("f-edit", (f) => {
    if (!confirm(`Save these contract changes to ${n.id}?`)) return null;
    const action = { action: "edit_contract", node: n.id };
    if (f.goal.value.trim()) action.goal = f.goal.value.trim();
    action.acceptance_criteria = lines(f.acceptance_criteria.value);
    action.verification = lines(f.verification.value);
    action.manual_verification = lines(f.manual_verification.value);
    return jpost(action);
  });
  submit("f-retry", () => {
    if (!confirm(`Retry ${n.id}?\n\nThis resets the node and its whole subtree to pending.`)) return null;
    return jpost({ action: "retry", node: n.id });
  });
  submit("f-amend", (f) => {
    const oldV = f.old.value.trim(), newV = f.new.value.trim();
    if (!oldV || !newV) return null;
    if (!confirm(`Amend the falsified constraint on ${n.id}?\n\n"${oldV}"\nbecomes\n"${newV}"`)) return null;
    return jpost({ action: "resolve", node: n.id, resolution: "amend", old: oldV, new: newV });
  });
  submit("f-dep", (f) => {
    const dep = f.dependency.value.trim();
    if (!dep) return null;
    if (!confirm(`Make ${n.id} wait for ${dep}?`)) return null;
    return jpost({ action: "resolve", node: n.id, resolution: "depends_on", dependency: dep });
  });
}
function lines(v) {
  return String(v || "").split("\n").map((s) => s.trim()).filter(Boolean);
}

/* ---------- detail polling ---------- */
function formFocused() {
  const a = document.activeElement;
  return !!(a && el("detail").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}

async function tickDetail(force) {
  if (!selected || detailBusy) return;
  if (!force && formFocused()) return; // never clobber what someone is typing
  detailBusy = true;
  try {
    const n = await jget("/api/node?id=" + encodeURIComponent(selected));
    const node = byId(selected);
    const sig = JSON.stringify([n.status, n.activity, n.depth, node && node.children, n.events && n.events.length]);
    if (force || sig !== selectedSig) {
      selectedSig = sig;
      el("detail").innerHTML = renderDetail(n);
      bindSteering(n);
    }
  } catch (err) {
    el("detail").innerHTML = `<div class="state-note err">Could not load node ${esc(selected)} — ${esc(err)}</div>`;
  } finally {
    detailBusy = false;
  }
}

/* ---------- main loop ---------- */
function setLive(status) {
  const live = el("live");
  live.className = "live " + (status === "ok" ? "busy" : status === "off" ? "off" : "");
  el("liveText").textContent =
    status === "ok" ? "live" : status === "off" ? "disconnected" : "connecting…";
}

async function tick(force) {
  try {
    state = await jget("/api/state");
    setLive("ok");
    el("project").textContent = state.project || "";
    el("project").title = state.project || "";
    renderOverview();
    renderTree();
    if (!selected && state.nodes.length) {
      const root = byId("root") || state.nodes[0];
      selected = root.id;
      renderTree();
    }
    await tickDetail(force);
  } catch (err) {
    setLive("off");
    if (!state) {
      el("overview").innerHTML = `<div class="state-note err">Dashboard disconnected — ${esc(err)}. Retrying…</div>`;
      el("tree").innerHTML = '<div class="state-note err">No state available.</div>';
    }
  }
}

document.addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-goto]");
  if (a) { ev.preventDefault(); selectNode(a.dataset.goto); }
});
el("view-graph").addEventListener("click", () => setView("graph"));
el("view-rows").addEventListener("click", () => setView("rows"));

/* A narrow phone gets the flat Rows view by default: the graph still works and
   is one tap away, but a wide graph must not be the first thing on a 390px
   screen. The choice is the viewer's after that. */
if (window.innerWidth < 640) setView("rows");

setInterval(tick, 2000);
tick(true);
</script>
</body>
