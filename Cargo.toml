[package]
name = "fractal"
version = "0.1.0"
edition = "2021"
description = "A persistent task tree executed by ephemeral agents"
license = "MIT"

[[bin]]
name = "fractal"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
which = "8"
ctrlc = "3.5.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
